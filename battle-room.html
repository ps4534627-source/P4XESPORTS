<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Room - FFM-P4X NEXUS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap');
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { overflow-x:hidden; width:100%; }
body { font-family:'Rajdhani',sans-serif; background:#0d1117; color:#fff; min-height:100vh; padding-bottom:85px; }
.navbar { position:sticky; top:0; z-index:100; background:rgba(22,27,34,0.98); backdrop-filter:blur(10px); border-bottom:2px solid #00d4ff; padding:10px 14px; display:flex; align-items:center; gap:10px; }
.back-btn { background:linear-gradient(135deg,#00d4ff,#0099ff); border:none; padding:8px 14px; border-radius:8px; color:#fff; font-weight:900; font-size:0.8rem; cursor:pointer; font-family:'Orbitron',sans-serif; flex-shrink:0; }
.back-btn:active { transform:scale(0.95); }
.nav-title { font-family:'Orbitron',sans-serif; font-size:1rem; font-weight:900; color:#00d4ff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.container { max-width:820px; margin:0 auto; padding:16px 12px; }

.banner-card { position:relative; border-radius:16px; overflow:hidden; border:2px solid rgba(0,212,255,0.5); margin-bottom:16px; }
.banner-card img { width:100%; height:150px; object-fit:cover; display:block; }
.banner-overlay { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(to top,rgba(0,0,0,0.9),transparent); padding:10px 14px; }
.banner-title { font-family:'Orbitron',sans-serif; font-size:1.1rem; font-weight:900; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,0.9); }
.banner-sub { font-size:0.75rem; color:#00ff88; font-weight:700; }

.info-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:18px; }
@media(min-width:600px){ .info-grid { grid-template-columns:repeat(4,1fr); } }
.info-box { background:#161b22; border:2px solid rgba(0,212,255,0.25); border-radius:12px; padding:10px; text-align:center; }
.info-box .label { font-size:0.6rem; color:#888; text-transform:uppercase; font-weight:700; letter-spacing:0.5px; }
.info-box .value { font-family:'Orbitron',sans-serif; font-size:0.95rem; font-weight:900; color:#00d4ff; margin-top:4px; }

.section-title { font-family:'Orbitron',sans-serif; font-size:1rem; font-weight:900; color:#00d4ff; margin-bottom:12px; display:flex; align-items:center; gap:8px; }

.slots-list { display:flex; flex-direction:column; gap:14px; }
.slot-card { background:#161b22; border:2px solid rgba(0,212,255,0.25); border-radius:14px; padding:12px; position:relative; }
.slot-card.your-team { border-color:#00ff88; box-shadow:0 0 25px rgba(0,255,136,0.35); background:linear-gradient(135deg,rgba(0,255,136,0.08),#161b22); }
.slot-card.empty-slot { border-style:dashed; border-color:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center; min-height:90px; color:#555; font-weight:700; font-size:0.85rem; flex-direction:column; gap:4px; }
.slot-header { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.slot-number { font-family:'Orbitron',sans-serif; font-size:0.7rem; font-weight:900; color:#00d4ff; background:rgba(0,212,255,0.1); border:1px solid rgba(0,212,255,0.3); border-radius:6px; padding:3px 8px; flex-shrink:0; }
.slot-logo { width:36px; height:36px; border-radius:8px; overflow:hidden; flex-shrink:0; background:#0d1117; display:flex; align-items:center; justify-content:center; font-size:1rem; }
.slot-logo img { width:100%; height:100%; object-fit:cover; }
.slot-teamname-row { flex:1; min-width:0; }
.slot-teamname { font-size:0.95rem; font-weight:900; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.your-team-tag { font-size:0.55rem; color:#00ff88; font-weight:900; letter-spacing:0.5px; }
.verified-badge, .nonverified-badge { display:inline-flex; align-items:center; gap:3px; font-size:0.55rem; font-weight:900; padding:2px 6px; border-radius:6px; margin-top:2px; }
.verified-badge { background:rgba(0,255,136,0.15); border:1px solid #00ff88; color:#00ff88; }
.nonverified-badge { background:rgba(136,136,136,0.15); border:1px solid #666; color:#999; }

.players-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.player-chip { display:flex; align-items:center; gap:7px; background:#0d1117; border:1px solid rgba(0,212,255,0.2); border-radius:8px; padding:6px 8px; min-width:0; }
.player-chip.extra { border-color:#ff4757; grid-column:1 / -1; }
.player-avatar-sm { width:24px; height:24px; border-radius:6px; background:linear-gradient(135deg,#00d4ff,#ff0080); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:0.7rem; overflow:hidden; }
.player-meta { min-width:0; }
.player-role { font-size:0.5rem; color:#00ff88; font-weight:900; text-transform:uppercase; }
.player-chip.extra .player-role { color:#ff4757; }
.player-name { font-size:0.72rem; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.player-uid { font-size:0.6rem; color:#666; }

.loading, .empty-msg { text-align:center; padding:40px 20px; color:#888; }

.bottom-nav { position:fixed; bottom:0; left:0; right:0; background:#161b22; border-top:1px solid rgba(0,212,255,0.3); display:flex; height:58px; z-index:999; }
.nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; background:none; border:none; color:#777; cursor:pointer; }
.nav-btn i { font-size:20px; } .nav-btn span { font-size:10px; font-weight:700; }
</style>
</head>
<body>

<div class="navbar">
  <button class="back-btn" onclick="window.location.href='view.html'">← BACK</button>
  <div class="nav-title" id="navTitle">TOURNAMENT ROOM</div>
</div>

<div class="container">
  <div id="loadingState" class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading battle room...</div>
  <div id="roomContent" style="display:none;">
    <div class="banner-card">
      <img id="bannerImg" src="" alt="banner">
      <div class="banner-overlay">
        <div class="banner-title" id="bannerTitle">Match</div>
        <div class="banner-sub" id="bannerSub">SQUAD</div>
      </div>
    </div>

    <div class="info-grid">
      <div class="info-box"><div class="label">Entry Fee</div><div class="value" id="infoFee">₹0</div></div>
      <div class="info-box"><div class="label">Prize Pool</div><div class="value" id="infoPrize">₹0</div></div>
      <div class="info-box"><div class="label">Date / Time</div><div class="value" id="infoTime" style="font-size:0.72rem;">-</div></div>
      <div class="info-box"><div class="label">Slots</div><div class="value" id="infoSlots">0/0</div></div>
    </div>

    <div class="section-title"><i class="fa-solid fa-users"></i> TEAM SLOTS</div>
    <div class="slots-list" id="slotsList"></div>
  </div>
</div>

<div class="bottom-nav">
  <button class="nav-btn" onclick="window.location.href='view.html'"><i class="fa-solid fa-house"></i><span>Home</span></button>
  <button class="nav-btn" onclick="window.location.href='rank.html'"><i class="fa-solid fa-trophy"></i><span>Rank</span></button>
  <button class="nav-btn" onclick="window.location.href='wallet.html'"><i class="fa-solid fa-wallet"></i><span>Wallet</span></button>
  <button class="nav-btn" onclick="window.location.href='history.html'"><i class="fa-solid fa-clock-rotate-left"></i><span>History</span></button>
  <button class="nav-btn" onclick="window.location.href='profile.html'"><i class="fa-solid fa-user"></i><span>Profile</span></button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDGLVLgX33dA3caK7wScbgN4BgE2NCjZx8",
  authDomain: "ffm-p4xesportscommunity.firebaseapp.com",
  projectId: "ffm-p4xesportscommunity",
  storageBucket: "ffm-p4xesportscommunity.firebasestorage.app",
  messagingSenderId: "796835743313",
  appId: "1:796835743313:web:e4356f63c3d1d51b605a70"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const battleId = params.get('battleId');
let currentUser = null;

onAuthStateChanged(auth, (user) => {
  if (!user) { window.location.href = 'index.html'; return; }
  currentUser = user;
  loadRoom();
});

function fmtDate(ts) {
  try {
    const d = ts?.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleString('en-IN', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
  } catch(e) { return 'N/A'; }
}

async function loadRoom() {
  if (!battleId) {
    document.getElementById('loadingState').innerHTML = '<div class="empty-msg">No battle selected.</div>';
    return;
  }
  try {
    const matchSnap = await getDoc(doc(db, 'matches', battleId));
    if (!matchSnap.exists()) {
      document.getElementById('loadingState').innerHTML = '<div class="empty-msg">Battle not found.</div>';
      return;
    }
    const match = matchSnap.data();
    document.getElementById('navTitle').textContent = match.matchTitle || match.matchType || 'TOURNAMENT ROOM';
    document.getElementById('bannerImg').src = match.mapImage || match.bannerImage || match.imageUrl || match.image || `https://via.placeholder.com/700x150/00d4ff/000?text=${encodeURIComponent(match.map||'MAP')}`;
    document.getElementById('bannerTitle').textContent = match.matchTitle || `${match.matchType} - ${match.map || ''}`;
    document.getElementById('bannerSub').textContent = `${match.matchType || 'SQUAD'} • ${match.venue || 'Online'} • ${match.status || ''}`.toUpperCase();
    document.getElementById('infoFee').textContent = '₹' + (match.entryFeeINR || 0);
    document.getElementById('infoPrize').textContent = '₹' + (match.prizePool || 0);
    document.getElementById('infoTime').textContent = fmtDate(match.matchDateTime);
    document.getElementById('infoSlots').textContent = `${match.currentSlots || 0}/${match.maxSlots || 0}`;

    // Load joined teams (battle_entries) for this match — ordered by join time so slot numbers are stable
    let entries = [];
    try {
      const q = query(collection(db, 'battle_entries'), where('matchId', '==', battleId), orderBy('timestamp', 'asc'));
      const snap = await getDocs(q);
      snap.forEach(d => entries.push({ id: d.id, ...d.data() }));
    } catch (e) {
      // Fallback without orderBy if a composite index isn't created yet
      console.warn('Falling back to unordered entries query (create a Firestore index for matchId+timestamp on battle_entries for stable slot order):', e.message);
      const q2 = query(collection(db, 'battle_entries'), where('matchId', '==', battleId));
      const snap2 = await getDocs(q2);
      snap2.forEach(d => entries.push({ id: d.id, ...d.data() }));
    }

    const maxSlots = match.maxSlots || entries.length || 1;
    const listEl = document.getElementById('slotsList');
    listEl.innerHTML = '';

    for (let i = 0; i < maxSlots; i++) {
      const entry = entries[i];
      if (!entry) {
        listEl.innerHTML += `
          <div class="slot-card empty-slot">
            <div>+</div>
            <div>TEAM SLOT AVAILABLE</div>
          </div>`;
        continue;
      }

      const isYourTeam = entry.userId === currentUser.uid || (entry.teamId && entry.teamId === (window.__myTeamId || null));
      const badge = entry.verificationStatus
        ? '<span class="verified-badge">🛡️ VERIFIED TEAM</span>'
        : '<span class="nonverified-badge">NON-VERIFIED TEAM</span>';
      const logo = entry.teamLogo
        ? `<img src="${entry.teamLogo}">`
        : '👥';

      let playersHtml = (entry.players || []).map(p => `
        <div class="player-chip ${p.isExtra ? 'extra' : ''}">
          <div class="player-avatar-sm">👤</div>
          <div class="player-meta">
            ${p.role ? `<div class="player-role">${p.isExtra ? 'EXTRA PLAYER' : p.role}</div>` : ''}
            <div class="player-name">${p.name || 'Player'}</div>
            <div class="player-uid">UID: ${p.uid || '-'}</div>
          </div>
        </div>`).join('');

      listEl.innerHTML += `
        <div class="slot-card ${isYourTeam ? 'your-team' : ''}" style="${entry.teamColor ? `border-color:${entry.teamColor}` : ''}">
          <div class="slot-header">
            <div class="slot-number">SLOT ${String(i + 1).padStart(2, '0')}</div>
            <div class="slot-logo" style="${entry.teamColor ? `border:2px solid ${entry.teamColor}` : ''}">${logo}</div>
            <div class="slot-teamname-row">
              <div class="slot-teamname">${entry.teamName || 'Team'}</div>
              ${badge}
              ${isYourTeam ? '<div class="your-team-tag">★ YOUR TEAM</div>' : ''}
            </div>
          </div>
          <div class="players-grid">${playersHtml || '<div style="color:#666;font-size:0.75rem;">No player data</div>'}</div>
        </div>`;
    }

    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('roomContent').style.display = 'block';

    // Resolve current user's teamId (for highlighting) after first render, then re-render if needed
    const userSnap = await getDoc(doc(db, 'users', currentUser.uid));
    if (userSnap.exists() && userSnap.data().teamId) {
      window.__myTeamId = userSnap.data().teamId;
      // Re-render once we know the team id, so a teammate (not just the joining owner) also sees "YOUR TEAM"
      loadRoomHighlightOnly(entries, maxSlots);
    }
  } catch (e) {
    console.error('Battle room load error:', e);
    document.getElementById('loadingState').innerHTML = '<div class="empty-msg">Error loading battle room. Please refresh.</div>';
  }
}

function loadRoomHighlightOnly(entries, maxSlots) {
  document.querySelectorAll('.slot-card').forEach((card, i) => {
    const entry = entries[i];
    if (entry && entry.teamId && entry.teamId === window.__myTeamId) {
      card.classList.add('your-team');
      if (!card.querySelector('.your-team-tag')) {
        const row = card.querySelector('.slot-teamname-row');
        if (row) row.insertAdjacentHTML('beforeend', '<div class="your-team-tag">★ YOUR TEAM</div>');
      }
    }
  });
}
</script>
</body>
</html>
