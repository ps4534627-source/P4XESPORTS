<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Profile - FFM-P4X NEXUS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    body { font-family: 'Rajdhani', sans-serif; background: #0d1117; color: #fff; min-height: 100vh; }
    body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, #0d1117 0%, #161b22 100%); z-index: -2; }
    #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
.navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(22, 27, 34, 0.98); backdrop-filter: blur(10px); border-bottom: 2px solid #00d4ff; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; height: 60px; }
.logo { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.logo img { width: 32px; height: 32px; }
.logo h1 { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 900; color: #00d4ff; letter-spacing: 1px; }
.back-btn { background: linear-gradient(135deg, #00d4ff, #0099ff); border: 2px solid #00d4ff; padding: 6px 14px; border-radius: 8px; color: #fff; font-weight: 900; font-size: 0.8rem; cursor: pointer; font-family: 'Orbitron', sans-serif; }
.back-btn:active { transform: scale(0.95); }
.container { max-width: 900px; margin: 0 auto; padding: 75px 15px 20px 15px; }
.profile-card { background: rgba(22, 27, 34, 0.8); border: 2px solid #00d4ff; border-radius: 20px; padding: 18px; margin-bottom: 25px; position: relative; overflow: hidden; }
.profile-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(0, 212, 255, 0.1) 0%, transparent 70%); animation: rotate 20s linear infinite; }
  @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.profile-header { display: flex; gap: 15px; align-items: flex-start; margin-bottom: 12px; position: relative; z-index: 1; }
.profile-avatar { width: 85px; height: 85px; border-radius: 16px; border: 3px solid #00d4ff; overflow: hidden; background: linear-gradient(135deg, #00d4ff, #ff0080); display: flex; align-items: center; justify-content: center; font-size: 2.2rem; box-shadow: 0 0 40px rgba(0, 212, 255, 0.5); flex-shrink: 0; }
.profile-avatar img { width: 100%; height: 100%; object-fit: cover; }

.profile-details { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.profile-name { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 900; color: #00d4ff; text-shadow: 0 0 20px rgba(0, 212, 255, 0.8); line-height: 1.1; word-break: break-word; }
.profile-username { font-size: 0.9rem; color: #ff6b00; font-weight: 700; margin-top: -2px; }
.profile-uid { font-size: 0.8rem; color: #888; font-weight: 700; }
.profile-uid span { color: #fff; }
.profile-college { font-size: 0.75rem; color: #00ff88; font-weight: 700; display: none; }
.profile-college.show { display: block; }

.badges-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.profile-rank { display: inline-flex; align-items: center; gap: 4px; background: linear-gradient(135deg, #ffd700, #ff6b00); border: 1px solid #ffd700; padding: 3px 8px; border-radius: 12px; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 0.65rem; color: #000; box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); animation: goldGlow 2s ease-in-out infinite; }
  @keyframes goldGlow { 0%, 100% { box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); } 50% { box-shadow: 0 0 25px rgba(255, 215, 0, 0.8); } }
.level-badge { display: inline-flex; align-items: center; gap: 4px; background: linear-gradient(135deg, #ff0080, #ff6b00); border: 2px solid #ff6b00; padding: 3px 8px; border-radius: 12px; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 0.65rem; color: #fff; animation: cyanPulse 2s ease-in-out infinite; }
  @keyframes cyanPulse { 0%, 100% { box-shadow: 0 0 10px rgba(255, 107, 0, 0.4); } 50% { box-shadow: 0 0 20px rgba(255, 107, 0, 0.7); } }

.title-line { background: rgba(0, 212, 255, 0.1); border: 1px solid rgba(0, 212, 255, 0.3); border-radius: 10px; padding: 8px 12px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 0.8rem; color: #00d4ff; position: relative; z-index: 1; }
.title-line.hidden { display: none; }
.title-line.title-icon { font-size: 1rem; }

.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; position: relative; z-index: 1; }
.stat-box { background: #161b22; border: 2px solid rgba(0, 212, 255, 0.3); border-radius: 10px; padding: 10px 6px; text-align: center; }
.stat-icon { font-size: 1.2rem; margin-bottom: 3px; }
.stat-value { font-family: 'Orbitron', sans-serif; font-size: 1.05rem; font-weight: 900; color: #00d4ff; margin-bottom: 2px; }
.stat-label { font-size: 0.55rem; color: #888; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }

.action-section { background: rgba(22, 27, 34, 0.8); border: 2px solid #00d4ff; border-radius: 16px; padding: 20px; margin-bottom: 20px; text-align: center; }
.like-btn { background: linear-gradient(135deg, #ff0064, #ff0080); border: 2px solid #ff0064; padding: 12px 30px; border-radius: 12px; color: #fff; font-weight: 900; font-size: 1rem; cursor: pointer; font-family: 'Orbitron', sans-serif; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
.like-btn.liked { background: #00ff88; border-color: #00ff88; color: #000; }
.like-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.like-btn:active:not(:disabled) { transform: scale(0.95); }
.like-count { font-size: 0.8rem; color: #888; margin-top: 8px; font-weight: 700; }
.error { text-align: center; margin-top: 100px; font-size: 1.2rem; color: #ff4757; }
.loading { text-align: center; padding: 50px; font-size: 1.2rem; color: #00d4ff; }

  @media (min-width: 768px) {
.navbar { padding: 14px 40px; height: 70px; }
.logo img { width: 45px; height: 45px; }
.logo h1 { font-size: 1.6rem; }
.container { padding: 95px 40px; }
.profile-avatar { width: 110px; height: 110px; font-size: 3rem; }
.profile-name { font-size: 2rem; }
  }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <div class="navbar">
    <div class="logo" onclick="history.back()">
      <img src="logo.png" alt="P4X">
      <h1>NEXUS</h1>
    </div>
    <button class="back-btn" onclick="history.back()">← BACK</button>
  </div>

  <div class="container" id="container">
    <div id="loading" class="loading">Loading Profile...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, arrayUnion, arrayRemove, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDGLVLgX33dA3caK7wScbgN4BgE2NCjZx8",
      authDomain: "ffm-p4xesportscommunity.firebaseapp.com",
      projectId: "ffm-p4xesportscommunity",
      storageBucket: "ffm-p4xesportscommunity.firebasestorage.app",
      messagingSenderId: "796835743313",
      appId: "1:796835743313:web:e4356f63c3d1d51b605a70"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const LEVEL_TYPES = {
      1: { name: 'COLLEGE', icon: '🎓' },
      2: { name: 'UNIVERSITY', icon: '🏛️' },
      3: { name: 'ZONAL', icon: '⭐' },
      4: { name: 'DISTRICT', icon: '🏅' },
      5: { name: 'STATE', icon: '👑' }
    };

    let currentUser = null;
    let viewUID = null;
    let unsubscribeProfile = null;

    async function showRealTimeRank(uid) {
      try {
        const usersSnap = await getDocs(collection(db, 'users'));
        let allUsers = [];

        usersSnap.forEach(docSnap => {
          const data = docSnap.data();
          const wins = data.wins || 0;
          const matches = data.matches || 0;
          const losses = Math.max(0, matches - wins);
          const diamonds = data.diamonds || 0;
          const kills = data.kills || 0;
          const exp = (wins * 100) + (losses * 25) + (diamonds * 1) + (kills * 10);

          allUsers.push({ uid: docSnap.id, exp: exp });
        });

        allUsers.sort((a, b) => b.exp - a.exp);
        const rank = allUsers.findIndex(u => u.uid === uid) + 1;

        const rankEl = document.getElementById('globalRank');
        if (rankEl) rankEl.textContent = '#' + (rank || 999);

      } catch (e) {
        console.error('Rank error:', e);
        const rankEl = document.getElementById('globalRank');
        if (rankEl) rankEl.textContent = '#999';
      }
    }

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (viewUID) loadProfileRealtime(viewUID);
    });

    const urlParams = new URLSearchParams(window.location.search);
    viewUID = urlParams.get('uid');

    if (!viewUID) {
      document.getElementById('container').innerHTML = '<div class="error">Player not found</div>';
    } else {
      loadProfileRealtime(viewUID);
    }

    function loadProfileRealtime(uid) {
      if (unsubscribeProfile) unsubscribeProfile();

      unsubscribeProfile = onSnapshot(doc(db, 'users', uid), (docSnap) => {
        if (!docSnap.exists()) {
          document.getElementById('container').innerHTML = '<div class="error">Player not found</div>';
          return;
        }

        const userData = docSnap.data();
        renderProfile(uid, userData);
        showRealTimeRank(uid);
      });
    }

    function renderProfile(uid, userData) {
      const likedBy = userData.likedBy || [];
      const likeCount = likedBy.length;
      const isLiked = currentUser && likedBy.includes(currentUser.uid);
      const isOwnProfile = currentUser && currentUser.uid === uid;

      const levelNum = userData.level || 1;
      const levelData = LEVEL_TYPES[levelNum] || LEVEL_TYPES[1];
      const lbTitle = userData.equippedLeaderboardTitle;

      document.getElementById('container').innerHTML = `
        <div class="profile-card">
          <div class="profile-header">
            <div class="profile-avatar">
              ${userData.photoURL? `<img src="${userData.photoURL}" alt="">` : '👤'}
            </div>
            <div class="profile-details">
              <div class="profile-name">${userData.name || 'Player'}</div>
              ${userData.username? `<div class="profile-username">${userData.username}</div>` : ''}
              <div class="profile-uid">FF UID: <span>${userData.ffuid || 'Not Set'}</span></div>
              ${userData.college? `<div class="profile-college show">🎓 ${userData.college}</div>` : ''}
              <div class="badges-row">
                <div class="profile-rank">
                  <span>🏆</span>
                  <span>RANK <span id="globalRank">#0</span></span>
                </div>
                <div class="level-badge">
                  <span>${levelData.icon}</span>
                  <span>${levelData.name}</span>
                </div>
              </div>
            </div>
          </div>

          ${lbTitle? `
            <div class="title-line">
              <span class="title-icon">👑</span>
              <span>${lbTitle.name}</span>
            </div>
          ` : ''}

          <div class="stats-grid">
            <div class="stat-box">
              <div class="stat-icon">💀</div>
              <div class="stat-value">${(userData.kills || 0).toLocaleString('en-IN')}</div>
              <div class="stat-label">KILLS</div>
            </div>
            <div class="stat-box">
              <div class="stat-icon">⚔️</div>
              <div class="stat-value">${(userData.matches || 0).toLocaleString('en-IN')}</div>
              <div class="stat-label">MATCHES</div>
            </div>
            <div class="stat-box">
              <div class="stat-icon">🏆</div>
              <div class="stat-value">${(userData.wins || 0).toLocaleString('en-IN')}</div>
              <div class="stat-label">WINS</div>
            </div>
            <div class="stat-box">
              <div class="stat-icon">💎</div>
              <div class="stat-value">${(userData.diamonds || 0).toLocaleString('en-IN')}</div>
              <div class="stat-label">DIAMONDS</div>
            </div>
          </div>
        </div>

        <div class="action-section">
          <button class="like-btn ${isLiked? 'liked' : ''}"
                  onclick="toggleLike('${uid}')"
                  ${isOwnProfile? 'disabled' : ''}>
            ${isOwnProfile? '💖 YOUR PROFILE' : isLiked? '✓ LIKED' : '❤️ LIKE'}
          </button>
          <div class="like-count">${likeCount} ${likeCount === 1? 'Like' : 'Likes'}</div>
        </div>
      `;
    }

    window.toggleLike = async function(uid) {
      if (!currentUser) {
        alert('Login to like profiles');
        return;
      }
      if (currentUser.uid === uid) {
        alert('You cannot like your own profile');
        return;
      }

      const btn = event.target;
      btn.disabled = true;

      try {
        const userRef = doc(db, 'users', uid);
        const userSnap = await getDoc(userRef);
        const likedBy = userSnap.data().likedBy || [];

        if (likedBy.includes(currentUser.uid)) {
          await updateDoc(userRef, { likedBy: arrayRemove(currentUser.uid) });
        } else {
          await updateDoc(userRef, { likedBy: arrayUnion(currentUser.uid) });
        }
      } catch (e) {
        console.error('Like error:', e);
        if (e.code === 'permission-denied') {
          alert('Permission denied. Update Firebase Rules!');
        } else {
          alert('Error updating like: ' + e.message);
        }
      } finally {
        btn.disabled = false;
      }
    }

    // Particles
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const particles = [];
    for(let i = 0; i < 20; i++) {
      particles.push({
        x: Math.random() * canvas.width, y: Math.random() * canvas.height,
        size: Math.random() * 2 + 1, speedX: (Math.random() - 0.5) * 0.3,
        speedY: (Math.random() - 0.5) * 0.3, opacity: Math.random() * 0.4 + 0.1
      });
    }
    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 212, 255, ${p.opacity})`; ctx.fill();
        p.x += p.speedX; p.y += p.speedY;
        if(p.x < 0 || p.x > canvas.width) p.speedX *= -1;
        if(p.y < 0 || p.y > canvas.height) p.speedY *= -1;
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
</html>
