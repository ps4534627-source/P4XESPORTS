<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - FFM-P4X NEXUS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Rajdhani', sans-serif; background: #0d1117; color: #fff; min-height: 100vh; padding-bottom: 140px; }
   .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(22, 27, 34, 0.98); border-bottom: 2px solid #00d4ff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
   .logo h1 { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; font-weight: 900; color: #00d4ff; }
   .container { max-width: 900px; margin: 0 auto; padding: 80px 15px 20px 15px; }

   .filters { background: rgba(22, 27, 34, 0.8); border: 2px solid #00d4ff; border-radius: 16px; padding: 15px; margin-bottom: 20px; }
   .filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
   .filter-row:last-child { margin-bottom: 0; }
   .filter-group label { font-size: 0.7rem; color: #888; font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 5px; }
   .filter-select { width: 100%; padding: 10px; background: #0d1117; border: 2px solid rgba(0, 212, 255, 0.3); border-radius: 8px; color: #fff; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 0.9rem; outline: none; }
   .filter-select:focus { border-color: #00d4ff; }

   .metric-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
   .metric-tab { flex: 1; background: rgba(0, 212, 255, 0.1); border: 2px solid rgba(0, 212, 255, 0.3); padding: 12px; border-radius: 10px; text-align: center; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 0.75rem; cursor: pointer; transition: 0.3s; }
   .metric-tab.active { background: linear-gradient(135deg, #00d4ff, #0099ff); border-color: #00d4ff; color: #000; }
   .metric-tab:active { transform: scale(0.95); }

   .filter-info { background: rgba(255, 107, 0, 0.1); border: 1px solid #ff6b00; border-radius: 10px; padding: 10px; margin-bottom: 15px; font-size: 0.8rem; text-align: center; font-weight: 700; }
   .leaderboard-list { display: flex; flex-direction: column; gap: 10px; }
   .player-card { background: rgba(22, 27, 34, 0.8); border: 2px solid rgba(0, 212, 255, 0.3); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.3s; }
   .player-card:active { transform: scale(0.98); }
   .player-card.rank-1 { border-color: #ffd700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }
   .player-card.rank-2 { border-color: #c0c0c0; box-shadow: 0 0 20px rgba(192, 192, 0.4); }
   .player-card.rank-3 { border-color: #cd7f32; box-shadow: 0 0 20px rgba(205, 127, 50, 0.4); }
   .rank-badge { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.1rem; flex-shrink: 0; }
   .rank-1.rank-badge { background: linear-gradient(135deg, #ffd700, #ff6b00); color: #000; }
   .rank-2.rank-badge { background: linear-gradient(135deg, #c0c0c0, #808080); color: #000; }
   .rank-3.rank-badge { background: linear-gradient(135deg, #cd7f32, #8b4513); color: #fff; }
   .rank-other.rank-badge { background: rgba(0, 212, 255, 0.2); color: #00d4ff; }
   .player-avatar { width: 45px; height: 45px; border-radius: 10px; border: 2px solid #00d4ff; overflow: hidden; flex-shrink: 0; }
   .player-avatar img { width: 100%; height: 100%; object-fit: cover; }
   .player-info { flex: 1; min-width: 0; }
   .player-name { font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: 900; color: #fff; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
   .player-location { font-size: 0.65rem; color: #ff6b00; margin-bottom: 4px; font-weight: 700; }
   .player-title { display: inline-flex; align-items: center; gap: 4px; background: rgba(255, 0, 0, 0.3); border: 1px solid #ff0000; padding: 2px 8px; border-radius: 8px; font-size: 0.65rem; font-weight: 900; color: #fff; margin-bottom: 4px; }
   .player-stats { display: flex; gap: 12px; font-size: 0.75rem; color: #888; }
   .stat-item { display: flex; align-items: center; gap: 3px; }
   .stat-value { color: #00d4ff; font-weight: 900; }
   .loading { text-align: center; padding: 40px; color: #666; }
   .empty { text-align: center; padding: 40px; color: #666; }

    /* ✅ LEFT SIDE POPUP */
   .quick-card { position: fixed; top: 80px; left: 15px; width: 280px; background: #161b22; border: 3px solid #00d4ff; border-radius: 16px; padding: 15px; box-shadow: 0 0 50px rgba(0, 212, 255, 0.6); z-index: 2000; transform: translateX(-320px); transition: 0.3s; max-height: calc(100vh - 100px); overflow-y: auto; }
   .quick-card.show { transform: translateX(0); }
   .quick-close { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%; background: rgba(255, 71, 87, 0.2); border: 2px solid #ff4757; color: #ff4757; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 900; }
   .quick-close:active { transform: scale(0.9); }
   .quick-avatar { width: 70px; height: 70px; border-radius: 12px; border: 3px solid #00d4ff; overflow: hidden; background: linear-gradient(135deg, #00d4ff, #ff0080); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 10px; box-shadow: 0 0 30px rgba(0, 212, 255, 0.5); }
   .quick-avatar img { width: 100%; height: 100%; object-fit: cover; }
   .quick-name { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 900; color: #00d4ff; text-align: center; margin-bottom: 6px; text-shadow: 0 0 15px rgba(0, 212, 255, 0.8); word-break: break-word; }
   .quick-college { font-size: 0.7rem; color: #00ff88; font-weight: 700; text-align: center; margin-bottom: 8px; }
   .quick-badges { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
   .quick-badge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 10px; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 0.6rem; }
   .quick-badge.level { background: linear-gradient(135deg, #ff0080, #ff6b00); border: 1px solid #ff6b00; color: #fff; }
   .quick-badge.title { background: rgba(0, 212, 255, 0.3); border: 1px solid #00d4ff; color: #00d4ff; }
   .quick-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 12px; }
   .quick-stat { background: #0d1117; border: 1px solid rgba(0, 212, 255, 0.3); border-radius: 8px; padding: 6px 4px; text-align: center; }
   .quick-stat-icon { font-size: 0.9rem; margin-bottom: 2px; }
   .quick-stat-value { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; font-weight: 900; color: #00d4ff; }
   .quick-stat-label { font-size: 0.5rem; color: #888; text-transform: uppercase; font-weight: 700; }
   .quick-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
   .quick-btn { padding: 10px; border: none; border-radius: 8px; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 0.75rem; cursor: pointer; text-transform: uppercase; }
   .quick-btn.like { background: linear-gradient(135deg, #ff0064, #ff0080); border: 2px solid #ff0064; color: #fff; }
   .quick-btn.like.liked { background: #00ff88; border-color: #00ff88; color: #000; }
   .quick-btn.visit { background: linear-gradient(135deg, #00d4ff, #0099ff); border: 2px solid #00d4ff; color: #fff; }
   .quick-btn:active { transform: scale(0.95); }
   .quick-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ✅ RED FIRE TABS - rank.html se copy */
   .rank-tabs {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background: #1a0a0a;
      padding: 6px;
      border-radius: 10px;
      border: 2px solid #ff1744;
      box-shadow: 0 0 40px rgba(255, 23, 68, 0.5);
      z-index: 998;
    }

   .tab-btn {
      padding: 8px 12px;
      background: rgba(255, 23, 68, 0.1);
      border: 2px solid rgba(255, 23, 68, 0.4);
      border-radius: 7px;
      color: #888;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 0.58rem;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

   .tab-btn:active { transform: scale(0.92); }

   .tab-btn.active {
      background: linear-gradient(135deg, #ff1744, #ff6b00);
      border-color: #ff1744;
      color: #fff;
      box-shadow: 0 0 25px rgba(255, 23, 68, 0.8), 0 0 50px rgba(255, 107, 0, 0.4);
      animation: firePulse 1.2s ease-in-out infinite;
    }

    @keyframes firePulse {
      0%, 100% {
        box-shadow: 0 0 25px rgba(255, 23, 68, 0.8), 0 0 50px rgba(255, 107, 0, 0.4);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 35px rgba(255, 23, 68, 1), 0 0 70px rgba(255, 107, 0, 0.6);
        transform: scale(1.03);
      }
    }

    /* ✅ RED FIRE BOTTOM NAV - rank.html se copy */
   .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #161b22;
      border-top: 2px solid #ff1744;
      display: flex;
      height: 58px;
      z-index: 999;
      box-shadow: 0 -5px 25px rgba(255, 23, 68, 0.4);
    }

   .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: none;
      border: none;
      color: #777;
      cursor: pointer;
      transition: all 0.15s ease;
    }

   .nav-btn:active { transform: scale(0.92); }
   .nav-btn.active { color: #ff1744; }

   .nav-btn.active i {
      color: #ff1744;
      text-shadow: 0 0 15px rgba(255, 23, 68, 0.9), 0 0 30px rgba(255, 107, 0, 0.6);
      animation: fireIconPulse 1.2s ease-in-out infinite;
    }

    @keyframes fireIconPulse {
      0%, 100% { text-shadow: 0 0 15px rgba(255, 23, 68, 0.9), 0 0 30px rgba(255, 107, 0, 0.6); transform: scale(1); }
      50% { text-shadow: 0 0 25px rgba(255, 23, 68, 1), 0 0 50px rgba(255, 107, 0, 0.8); transform: scale(1.12); }
    }

   .nav-btn i { font-size: 20px; }
   .nav-btn span { font-size: 10px; font-weight: 700; }
   .nav-btn.active span { color: #ff1744; font-weight: 900; }

   .profile-img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #777;
    }

   .nav-btn.active.profile-img {
      border: 2px solid #ff1744;
      box-shadow: 0 0 15px rgba(255, 23, 68, 0.7);
    }

    @media (min-width: 768px) {
     .filter-row { grid-template-columns: repeat(4, 1fr); }
     .quick-card { left: 40px; }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="logo">
      <h1>NEXUS LEADERBOARD</h1>
    </div>
  </div>
  <div class="container">

    <div class="filters">
      <div class="filter-row">
        <div class="filter-group">
          <label>STATE</label>
          <select class="filter-select" id="stateFilter" onchange="loadLeaderboard()">
            <option value="">🇮🇳 All India</option>
          </select>
        </div>
        <div class="filter-group">
          <label>DISTRICT</label>
          <select class="filter-select" id="districtFilter" onchange="loadLeaderboard()">
            <option value="">All Districts</option>
          </select>
        </div>
        <div class="filter-group">
          <label>COLLEGE</label>
          <select class="filter-select" id="collegeFilter" onchange="loadLeaderboard()">
            <option value="">All Colleges</option>
          </select>
        </div>
        <div class="filter-group">
          <label>SORT BY</label>
          <select class="filter-select" id="metricFilter" onchange="loadLeaderboard()">
            <option value="wins">🏆 Wins</option>
            <option value="diamonds">💎 Diamonds</option>
            <option value="matches">⚔️ Matches</option>
            <option value="kills">💀 Kills</option>
          </select>
        </div>
      </div>
    </div>

    <div class="filter-info" id="filterInfo">🇮🇳 Showing Top 100 Players in India by Wins</div>

    <div class="leaderboard-list" id="leaderboardList">
      <div class="loading">Loading leaderboard...</div>
    </div>
  </div>

  <!-- ✅ LEFT SIDE CARD -->
  <div class="quick-card" id="quickCard">
    <div class="quick-close" onclick="closeQuickCard()">×</div>
    <div id="quickContent">Loading...</div>
  </div>

  <!-- ✅ RANK TABS - LETTERBOARD ACTIVE -->
  <div class="rank-tabs">
    <button class="tab-btn active" id="leaderboardTab" onclick="switchTab('leaderboard')">
      <i class="fa-solid fa-trophy"></i> LETTERBOARD
    </button>
    <button class="tab-btn" id="globalTab" onclick="switchTab('global')">
      <i class="fa-solid fa-globe"></i> GLOBAL RANK
    </button>
  </div>

  <!-- ✅ RED FIRE BOTTOM NAV -->
  <div class="bottom-nav">
    <button class="nav-btn" onclick="navClick(this, 'view')">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </button>
    <button class="nav-btn active" onclick="navClick(this, 'rank')">
      <i class="fa-solid fa-trophy"></i>
      <span>Rank</span>
    </button>
    <button class="nav-btn" onclick="navClick(this, 'wallet')">
      <i class="fa-solid fa-wallet"></i>
      <span>Wallet</span>
    </button>
    <button class="nav-btn" onclick="navClick(this, 'history')">
      <i class="fa-solid fa-clock-rotate-left"></i>
      <span>History</span>
    </button>
    <button class="nav-btn" onclick="navClick(this, 'profile')">
      <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=ProGamer" class="profile-img" id="navProfilePic" alt="Profile">
      <span>Profile</span>
    </button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, query, where, orderBy, limit, getDocs, doc, getDoc, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDGLVLgX33dA3caK7wScbgN4BgE2NCjZx8",
      authDomain: "ffm-p4xesportscommunity.firebaseapp.com",
      projectId: "ffm-p4xesportscommunity",
      storageBucket: "ffm-p4xesportscommunity.firebasestorage.app",
      messagingSenderId: "796835743313",
      appId: "1:796835743313:web:e4356f63c3d1d51b605a70"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const statesDistricts = {
      "Bihar": ["Patna", "Gaya", "Bhagalpur", "Muzaffarpur", "Darbhanga", "Purnia", "Araria", "Gopalganj", "Siwan", "Chhapra", "Sasaram", "Buxar", "Nawada", "Aurangabad", "Jehanabad"],
      "Uttar Pradesh": ["Lucknow", "Kanpur", "Varanasi", "Agra", "Meerut", "Allahabad", "Ghaziabad", "Bareilly", "Aligarh", "Moradabad"],
      "Maharashtra": ["Mumbai", "Pune", "Nagpur", "Nashik", "Aurangabad", "Solapur", "Thane", "Kolhapur"],
      "Punjab": ["Amritsar", "Ludhiana", "Jalandhar", "Patiala", "Bathinda", "Mohali", "Pathankot"],
      "West Bengal": ["Kolkata", "Howrah", "Durgapur", "Asansol", "Siliguri", "Bardhaman"],
      "Rajasthan": ["Jaipur", "Jodhpur", "Udaipur", "Kota", "Bikaner", "Ajmer"],
      "Madhya Pradesh": ["Bhopal", "Indore", "Gwalior", "Jabalpur", "Ujjain"],
      "Gujarat": ["Ahmedabad", "Surat", "Vadodara", "Rajkot", "Bhavnagar"],
      "Tamil Nadu": ["Chennai", "Coimbatore", "Madurai", "Salem", "Tiruchirappalli"],
      "Karnataka": ["Bangalore", "Mysore", "Hubli", "Mangalore", "Belgaum"],
      "Delhi": ["New Delhi", "Central Delhi", "North Delhi", "South Delhi", "East Delhi", "West Delhi"]
    };

    Object.keys(statesDistricts).sort().forEach(state => {
      const opt = document.createElement('option');
      opt.value = state;
      opt.textContent = state;
      document.getElementById('stateFilter').appendChild(opt);
    });

    document.getElementById('stateFilter').addEventListener('change', function() {
      const state = this.value;
      const districtSelect = document.getElementById('districtFilter');
      districtSelect.innerHTML = '<option value="">All Districts</option>';
      document.getElementById('collegeFilter').innerHTML = '<option value="">All Colleges</option>';

      if (state && statesDistricts[state]) {
        statesDistricts[state].sort().forEach(dist => {
          const opt = document.createElement('option');
          opt.value = dist;
          opt.textContent = dist;
          districtSelect.appendChild(opt);
        });
      }
    });

    document.getElementById('districtFilter').addEventListener('change', async function() {
      const district = this.value;
      const collegeSelect = document.getElementById('collegeFilter');
      collegeSelect.innerHTML = '<option value="">All Colleges</option>';

      if (district) {
        const q = query(collection(db, 'users'), where('district', '==', district));
        const snap = await getDocs(q);
        const colleges = new Set();
        snap.forEach(doc => {
          const data = doc.data();
          if (data.college) colleges.add(data.college);
        });
        Array.from(colleges).sort().forEach(col => {
          const opt = document.createElement('option');
          opt.value = col;
          opt.textContent = col;
          collegeSelect.appendChild(opt);
        });
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        loadLeaderboard();
        // Load profile pic in nav
        getDoc(doc(db, 'users', user.uid)).then(docSnap => {
          if (docSnap.exists() && docSnap.data().photoURL) {
            document.getElementById('navProfilePic').src = docSnap.data().photoURL;
          }
        });
      } else {
        window.location.href = 'index.html';
      }
    });

    window.loadLeaderboard = async function() {
      const state = document.getElementById('stateFilter').value;
      const district = document.getElementById('districtFilter').value;
      const college = document.getElementById('collegeFilter').value;
      const metric = document.getElementById('metricFilter').value;

      const listEl = document.getElementById('leaderboardList');
      const filterEl = document.getElementById('filterInfo');
      listEl.innerHTML = '<div class="loading">Loading leaderboard...</div>';

      try {
        let q = collection(db, 'users');
        let constraints = [];
        let filterText = '';

        if (!state &&!district &&!college) {
          filterText = `🇮🇳 Showing Top 100 Players in India by ${metric.toUpperCase()}`;
          constraints = [orderBy(metric, 'desc'), limit(100)];
        }
        else if (state &&!district &&!college) {
          filterText = `📍 Showing Top 100 Players in ${state} by ${metric.toUpperCase()}`;
          constraints = [where('state', '==', state), orderBy(metric, 'desc'), limit(100)];
        }
        else if (state && district &&!college) {
          filterText = `🏅 Showing Top 100 Players in ${district}, ${state} by ${metric.toUpperCase()}`;
          constraints = [where('state', '==', state), where('district', '==', district), orderBy(metric, 'desc'), limit(100)];
        }
        else if (college) {
          filterText = `🎓 Showing Top 100 Players in ${college} by ${metric.toUpperCase()}`;
          constraints = [where('college', '==', college), orderBy(metric, 'desc'), limit(100)];
        }

        filterEl.innerHTML = filterText;
        const finalQuery = query(q,...constraints);
        const snapshot = await getDocs(finalQuery);

        if (snapshot.empty) {
          listEl.innerHTML = '<div class="empty">No players found in this category</div>';
          return;
        }

        let html = '';
        let rank = 0;
        snapshot.forEach(doc => {
          rank++;
          const data = doc.data();
          const rankClass = rank === 1? 'rank-1' : rank === 2? 'rank-2' : rank === 3? 'rank-3' : 'rank-other';
          const hasTitle = data.equippedLeaderboardTitle;
          const location = [data.district, data.state].filter(Boolean).join(', ');

          html += `
            <div class="player-card ${rankClass}" onclick="openQuickCard('${doc.id}')">
              <div class="rank-badge">#${rank}</div>
              <div class="player-avatar">
                <img src="${data.photoURL || 'https://via.placeholder.com/45'}" alt="">
              </div>
              <div class="player-info">
                <div class="player-name">${data.name || 'Player'}</div>
                ${location? `<div class="player-location">📍 ${location}</div>` : ''}
                ${hasTitle? `
  <div class="player-title">
    ${data.equippedLeaderboardTitle.icon || ''}
    ${data.equippedLeaderboardTitle.name}
  </div>
` : ''}
                <div class="player-stats">
                  <div class="stat-item">🏆 <span class="stat-value">${(data.wins || 0).toLocaleString('en-IN')}</span></div>
                  <div class="stat-item">💀 <span class="stat-value">${(data.kills || 0).toLocaleString('en-IN')}</span></div>
                  <div class="stat-item">💎 <span class="stat-value">${(data.diamonds || 0).toLocaleString('en-IN')}</span></div>
                  <div class="stat-item">⚔️ <span class="stat-value">${(data.matches || 0).toLocaleString('en-IN')}</span></div>
                </div>
              </div>
            </div>
          `;
        });
        listEl.innerHTML = html;

      } catch (e) {
        console.error('Leaderboard error:', e);
        filterEl.innerHTML = '❌ Error: Create Firebase Index first';
        listEl.innerHTML = '<div class="empty">Firebase Index required. Check console for link.</div>';
      }
    }

    // ✅ LEFT SIDE CARD FUNCTIONS
    const LEVEL_TYPES = {
      1: { name: 'COLLEGE', icon: '🎓' },
      2: { name: 'UNIVERSITY', icon: '🏛️' },
      3: { name: 'ZONAL', icon: '⭐' },
      4: { name: 'DISTRICT', icon: '🏅' },
      5: { name: 'STATE', icon: '👑' }
    };

    window.openQuickCard = async function(uid) {
      const card = document.getElementById('quickCard');
      const content = document.getElementById('quickContent');
      card.classList.add('show');
      content.innerHTML = '<div style="text-align:center;padding:20px;">Loading...</div>';

      try {
        const userSnap = await getDoc(doc(db, 'users', uid));
        if (!userSnap.exists()) {
          content.innerHTML = '<div style="text-align:center;padding:20px;color:#ff4757;">User not found</div>';
          return;
        }

        const userData = userSnap.data();
        const levelData = LEVEL_TYPES[userData.level || 1];
        const lbTitle = userData.equippedLeaderboardTitle;
        const likedBy = userData.likedBy || [];
        const isLiked = auth.currentUser && likedBy.includes(auth.currentUser.uid);
        const isOwnProfile = auth.currentUser && auth.currentUser.uid === uid;

        content.innerHTML = `
          <div class="quick-avatar">
            ${userData.photoURL? `<img src="${userData.photoURL}" alt="">` : '👤'}
          </div>
          <div class="quick-name">${userData.name || 'Player'}</div>
          ${userData.college? `<div class="quick-college">🎓 ${userData.college}</div>` : ''}
          <div class="quick-badges">
            <div class="quick-badge level">
              <span>${levelData.icon}</span>
              <span>${levelData.name}</span>
            </div>
            ${lbTitle? `
              <div class="quick-badge title">
                <span>${lbTitle.icon || ''}</span>
                <span>${lbTitle.name}</span>
              </div>
            ` : ''}
          </div>
          <div class="quick-stats">
            <div class="quick-stat">
              <div class="quick-stat-icon">💀</div>
              <div class="quick-stat-value">${(userData.kills || 0).toLocaleString('en-IN')}</div>
              <div class="quick-stat-label">KILLS</div>
            </div>
            <div class="quick-stat">
              <div class="quick-stat-icon">⚔️</div>
              <div class="quick-stat-value">${(userData.matches || 0).toLocaleString('en-IN')}</div>
              <div class="quick-stat-label">MATCHES</div>
            </div>
            <div class="quick-stat">
              <div class="quick-stat-icon">🏆</div>
              <div class="quick-stat-value">${(userData.wins || 0).toLocaleString('en-IN')}</div>
              <div class="quick-stat-label">WINS</div>
            </div>
            <div class="quick-stat">
              <div class="quick-stat-icon">💎</div>
              <div class="quick-stat-value">${(userData.diamonds || 0).toLocaleString('en-IN')}</div>
              <div class="quick-stat-label">DIAMONDS</div>
            </div>
          </div>
          <div class="quick-btns">
            <button class="quick-btn like ${isLiked? 'liked' : ''}"
                    onclick="toggleLikeQuick('${uid}')"
                    ${isOwnProfile? 'disabled' : ''}>
              ${isOwnProfile? 'YOUR PROFILE' : isLiked? '✓ LIKED' : '❤️ LIKE'}
            </button>
            <button class="quick-btn visit" onclick="window.location.href='view-profile.html?uid=${uid}'">
              👤 VISIT
            </button>
          </div>
        `;
      } catch (e) {
        console.error(e);
        content.innerHTML = '<div style="text-align:center;padding:20px;color:#ff4757;">Error loading</div>';
      }
    }

    window.closeQuickCard = function() {
      document.getElementById('quickCard').classList.remove('show');
    }

 window.toggleLikeQuick = async function(uid) {
      if (!auth.currentUser) {
        alert('Login to like profiles');
        return;
      }
      if (auth.currentUser.uid === uid) return;

      try {
        const userRef = doc(db, 'users', uid);
        const userSnap = await getDoc(userRef);
        const likedBy = userSnap.data().likedBy || [];

        if (likedBy.includes(auth.currentUser.uid)) {
          await updateDoc(userRef, { likedBy: arrayRemove(auth.currentUser.uid) });
        } else {
          await updateDoc(userRef, { likedBy: arrayUnion(auth.currentUser.uid) });
        }
        openQuickCard(uid); // Refresh card
      } catch (e) {
        console.error(e);
        alert('Error updating like');
      }
    }

    // ✅ TAB SWITCH FUNCTION
    window.switchTab = function(tab) {
      if (tab === 'leaderboard') {
        window.location.href = 'leaderboard.html';
      } else {
        window.location.href = 'rank.html';
      }
    }

    // ✅ BOTTOM NAV CLICK FUNCTION
    window.navClick = function(btn, page) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      if(page === 'rank') return;
      window.location.href = page + '.html';
    }
  </script>
</body>
</html>
