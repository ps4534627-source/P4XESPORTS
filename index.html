  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      font-family: 'Rajdhani', sans-serif;

    body::before {
      content: '';

   .header {

   .header h1 {

   .container {

   .login-wrap {

    /* LEFT SIDE - Kelly Body - Card Ke Peeche */
   .kelly-body {

    /* LEFT SIDE - Kelly Gun - Card Ke Aage */
   .kelly-gun {
      position: absolute;

    /* CENTER - CharAB Logo - CARD KE PEECHE, TITLE KO TOUCH KAREGA */
   .char-center-body {
      position: absolute;
      left: 50%;

      transform: translateX(-50%);

      object-fit: contain;

      pointer-events: none;
      filter: drop-shadow(0 0 60px rgba(0, 212, 255, 0.9));

    /* RIGHT SIDE - CharAB Gun - RIGHT SIDE HI RAHEGI */
   .char-right-gun {
      position: absolute;

      pointer-events: none;
    }

   .login-section {
      position: relative;
      z-index: 15;
      width: 100%;
      padding: 40px 30px;

   .login-section h2 {

    }
   .form-group { margin-bottom: 22px; }
    label {
      display: block;
      margin-bottom: 8px;
      color: #b8b8b8;

      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    input {
      width: 100%;
      padding: 15px;
      background: rgba(10, 10, 20, 0.9);
      border: 1px solid rgba(0, 212, 255, 0.3);

      font-family: 'Rajdhani', sans-serif;
      transition: 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #00d4ff;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
    }
   .btn {
      width: 100%;
      padding: 17px;
      background: linear-gradient(90deg, #00d4ff, #9c27b0);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      text-transform: uppercase;
      margin-top: 10px;
      box-shadow: 0 5px 40px rgba(0, 212, 255, 0.6);
    }
   .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
   .error { color: #ff4757; font-size: 0.85rem; margin-top: 8px; display: none; }
   .success { color: #00ff88; font-size: 0.85rem; margin-top: 8px; display: none; }
   .username-status { font-size: 0.75rem; margin-top: 5px; min-height: 18px; }
   .username-status.available { color: #00ff88; }
   .username-status.taken { color: #ff4757; }
   .username-status.checking { color: #888; }

    @media (max-width: 1400px) {
     .kelly-body,.kelly-gun { left: -400px; width: 1500px; height: 1900px; bottom: -280px; }
     .char-center-body { width: 650px; height: 650px; top: -280px; }
     .char-right-gun { right: -380px; width: 1305px; height: 1881px; bottom: -268px; }
    }
    @media (max-width: 768px) {
     .header h1 { font-size: 1.5rem; }
     .login-wrap { margin-top: 40px; max-width: 340px; }
     .kelly-body,.kelly-gun { left: -180px; width: 700px; bottom: -140px; height: 900px; }
     .char-center-body { width: 500px; height: 500px; top: -220px; }
     .char-right-gun { right: -160px; width: 612px; bottom: -140px; height: 891px; }
     .login-section { padding: 35px 25px; }
     .login-section h2 { font-size: 1.5rem; }
    }
    @media (max-width: 480px) {
     .kelly-body,.kelly-gun { left: -120px; width: 500px; bottom: -110px; height: 650px; }

<body>
  <div class="header">
    <h1>FFM-P4X ESPORTS COMMUNITY</h1>
    <p>Join the Ultimate Battlegrounds Arena • Compete • Win • Earn</p>
  </div>

  <div class="container">
    <div class="login-wrap">
      <!-- LEFT SIDE - Kelly -->
      <img src="kellyz.png" alt="Kelly Body" class="kelly-body">
      <img src="kellyz_gun.png" alt="Kelly Gun" class="kelly-gun">

      <!-- CENTER - CharAB Logo PEECHE -->
      <img src="logo.png" alt="P4X Logo" class="char-center-body">

      <!-- RIGHT SIDE - CharAB Gun -->
      <img src="charAB_gun.png" alt="CharAB Gun" class="char-right-gun">

      <div class="login-section">
        <h2>PLAYER LOGIN</h2>
        <div class="form-group">
          <label>Email ID</label>
          <input type="email" id="email-input" placeholder="your@gmail.com">
        </div>
        <div class="form-group" id="name-group" style="display:none;">
          <label>Gamer Name</label>
          <input type="text" id="name-input" placeholder="Pro Player">
        </div>
        <div class="form-group" id="username-group" style="display:none;">
          <label>Username</label>
          <input type="text" id="username-input" placeholder="proplayer123" maxlength="20">
          <div class="username-status" id="username-status"></div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password-input" placeholder="••••••••">
        </div>
        <div class="error" id="email-error"></div>
        <div class="success" id="email-success"></div>
        <button class="btn" id="email-action-btn">Login / Sign Up</button>
      </div>
    </div>
  </div>

  <script type="module">
  
  function setSignupMode(isSignup) {
  const kellyBody = document.querySelector('.kelly-body');
  const kellyGun = document.querySelector('.kelly-gun');
  const charRightGun = document.querySelector('.char-right-gun');

  if (isSignup) {
    // Signup mode
    kellyBody.style.display = 'none';
    kellyGun.style.display = 'none';
    charRightGun.style.display = 'none';
  } else {
    // Login mode
    kellyBody.style.display = 'block';
    kellyGun.style.display = 'block';
    charRightGun.style.display = 'block';
  }
}
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, fetchSignInMethodsForEmail, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDGLVLgX33dA3caK7wScbgN4BgE2NCjZx8",
      authDomain: "ffm-p4xesportscommunity.firebaseapp.com",
      databaseURL: "https://ffm-p4xesportscommunity-default-rtdb.firebaseio.com",
      projectId: "ffm-p4xesportscommunity",
      storageBucket: "ffm-p4xesportscommunity.firebasestorage.app",
      messagingSenderId: "796835743313",
      appId: "1:796835743313:web:e4356f63c3d1d51b605a70"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let usernameCheckTimeout = null;
    let isUsernameAvailable = false;

    // Auto-generate username jab naam likhe
    document.getElementById('name-input').addEventListener('input', (e) => {
      const name = e.target.value.trim().toLowerCase().replace(/\s+/g, '').replace(/[^a-z0-9]/g, '');
      if (name.length >= 3) {
        const suggested = name + Math.floor(100 + Math.random() * 900);
        document.getElementById('username-input').value = suggested;
        checkUsernameAvailability(suggested);
      }
    });

    // Real-time username check
    document.getElementById('username-input').addEventListener('input', (e) => {
      clearTimeout(usernameCheckTimeout);

      let newName = e.target.value.toLowerCase().replace(/[^a-z0-9]/g, '');
      e.target.value = newName;

      if (newName.length < 4) {
        updateUsernameStatus('checking', 'Kam se kam 4 characters');
        isUsernameAvailable = false;
        return;
      }

      updateUsernameStatus('checking', 'Checking...');

      usernameCheckTimeout = setTimeout(() => {
        checkUsernameAvailability(newName);
      }, 500);
    });

    async function checkUsernameAvailability(username) {
      const statusEl = document.getElementById('username-status');

      try {
        const q = query(collection(db, "users"), where("username", "==", "@" + username));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          statusEl.className = 'username-status available';
          statusEl.textContent = '✓ @' + username + ' available hai';
          isUsernameAvailable = true;
        } else {
          statusEl.className = 'username-status taken';
          statusEl.textContent = '✗ Ye username liya hua hai';
          isUsernameAvailable = false;
        }
      } catch (err) {
        statusEl.className = 'username-status checking';
        statusEl.textContent = 'Check nahi ho pa raha';
        isUsernameAvailable = false;
      }
    }

    function updateUsernameStatus(type, message) {
      const statusEl = document.getElementById('username-status');
      statusEl.className = 'username-status ' + type;
      statusEl.textContent = message;
    }

    document.getElementById('email-action-btn').addEventListener('click', async () => {
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;
      const name = document.getElementById('name-input').value.trim();
      const username = document.getElementById('username-input').value.trim();
      const errorEl = document.getElementById('email-error');
      const successEl = document.getElementById('email-success');
      const nameGroup = document.getElementById('name-group');
      const usernameGroup = document.getElementById('username-group');
      const btn = document.getElementById('email-action-btn');

      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      if (!email ||!password) {
        errorEl.textContent = 'Email aur Password daalo';
        errorEl.style.display = 'block';
        return;
      }
      if (password.length < 6) {
        errorEl.textContent = 'Password kam se kam 6 digit ka hona chahiye';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Wait...';

      try {
        const methods = await fetchSignInMethodsForEmail(auth, email);

        if (methods.length === 0) {
          // NAYA USER - SIGNUP
          if (!name && nameGroup.style.display === 'none') {
            nameGroup.style.display = 'block';
            usernameGroup.style.display = 'block';
            setSignupMode(true);
            errorEl.textContent = 'Naya account? Naam aur Username bhi daalo';
            errorEl.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Sign Up Karo';
            return;
          }

          if (!name) {
            errorEl.textContent = 'Naam daalo sign up ke liye';
            errorEl.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Sign Up Karo';
            return;
          }

          if (!username) {
            errorEl.textContent = 'Username daalo';
            errorEl.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Sign Up Karo';
            return;
          }

          if (!isUsernameAvailable) {
            errorEl.textContent = 'Username available nahi hai, dusra chuno';
            errorEl.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Sign Up Karo';
            return;
          }

          const userCred = await createUserWithEmailAndPassword(auth, email, password);
          await updateProfile(userCred.user, { displayName: name });

          // ✅ POORA USER DATA BANEGA AB
  await setDoc(doc(db, 'users', userCred.user.uid), {
  name: name,
  email: email,
  username: "@" + username,
  userId: userCred.user.uid,

  ffuid: "",
  state: "",
  district: "",
  college: "",
  photoURL: "",

  balance: 0,
  wallet: 0,
  p4x_coins: 0,
  rank: 0,

  kills: 0,
  matches: 0,
  wins: 0,
  diamonds: 0,

  level: 1,
  unlockedLevels: [1],
  unlockedTitles: [],
  equippedTitles: [],

  referralCode: "",
  referralEarnings: 0,

  teamId: null,
  friends: [],
  friendRequests: [],
  sentRequests: [],
  teamInvites: [],
  online: true,
  lastSeen: Date.now(),
  likedBy: [],
  bio: "",

    teamId: null,
  friends: [],
  friendRequests: [],
  sentRequests: [],
  teamInvites: [],
  online: true,
  lastSeen: Date.now(),
  likedBy: [],
  bio: "",
  
  createdAt: Date.now()
});

          window.location.replace("view.html");

        } else {
          // PURANA USER - SIRF LOGIN
          nameGroup.style.display = 'none';
          usernameGroup.style.display = 'none';
          setSignupMode(false);
          await signInWithEmailAndPassword(auth, email, password);
          window.location.replace("view.html");
        }

      } catch (error) {
        console.error('Signup/Login Error:', error);
        let msg = 'Email ya Password galat hai!';
        if (error.code === 'auth/wrong-password') msg = 'Galat password! Sahi password daalo.';
        if (error.code === 'auth/invalid-email') msg = 'Email format galat hai!';
        if (error.code === 'auth/too-many-requests') msg = 'Bahut baar try kar liya. Thodi der baad try karo.';
        if (error.code === 'auth/email-already-in-use') msg = 'Ye email pehle se register hai';
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Login / Sign Up';
      }
    });
  </script>
</body>
