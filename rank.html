<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Ranking - FFM-P4X NEXUS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none !important; }
    body { font-family: 'Rajdhani', sans-serif; background: #0d1117; color: #fff; min-height: 100vh; padding-bottom: 75px; }
    body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, #0d1117 0%, #161b22 100%); z-index: -2; }
    #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
    .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(22, 27, 34, 0.98); backdrop-filter: blur(10px); border-bottom: 2px solid #00d4ff; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; height: 60px; }
    .logo { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .logo img { width: 32px; height: 32px; }
    .logo h1 { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 900; color: #00d4ff; letter-spacing: 1px; }
    .back-btn { background: linear-gradient(135deg, #00d4ff, #0099ff); border: 2px solid #00d4ff; padding: 6px 14px; border-radius: 8px; color: #fff; font-weight: 900; font-size: 0.8rem; cursor: pointer; font-family: 'Orbitron', sans-serif; }
    .back-btn:active { transform: scale(0.95); }
    .container { max-width: 900px; margin: 0 auto; padding: 75px 15px 140px 15px; }
    .header-card { background: rgba(22, 27, 34, 0.8); border: 2px solid #00d4ff; border-radius: 16px; padding: 16px; margin-bottom: 20px; text-align: center; }
    .header-title { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; color: #00d4ff; font-weight: 900; text-shadow: 0 0 20px rgba(0, 212, 255, 0.8); margin-bottom: 8px; }
    .header-sub { font-size: 0.75rem; color: #888; font-weight: 700; }
    .my-rank-card { background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(255, 0, 128, 0.15)); border: 2px solid #00d4ff; border-radius: 16px; padding: 14px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .my-rank-left { flex: 1; }
    .my-rank-label { font-size: 0.65rem; color: #888; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
    .my-rank-value { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900; color: #00d4ff; text-shadow: 0 0 20px rgba(0, 212, 255, 0.8); }
    .my-exp { font-size: 0.75rem; color: #00ff88; font-weight: 700; }
    .ranking-list { display: flex; flex-direction: column; gap: 8px; }
    .rank-item { background: rgba(22, 27, 34, 0.8); border: 2px solid rgba(0, 212, 255, 0.3); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 12px; transition: 0.2s; cursor: pointer; }
    .rank-item:active { transform: scale(0.98); }
    .rank-item.top1 { border-color: #ffd700; background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(22, 27, 34, 0.8)); box-shadow: 0 0 30px rgba(255, 215, 0, 0.4); }
    .rank-item.top2 { border-color: #c0c0c0; background: linear-gradient(135deg, rgba(192, 192, 0.15), rgba(22, 27, 34, 0.8)); }
    .rank-item.top3 { border-color: #cd7f32; background: linear-gradient(135deg, rgba(205, 127, 50, 0.15), rgba(22, 27, 34, 0.8)); }
    .rank-number { width: 45px; height: 45px; border-radius: 10px; background: rgba(0, 212, 255, 0.2); border: 2px solid #00d4ff; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.1rem; color: #00d4ff; flex-shrink: 0; }
    .rank-item.top1 .rank-number { background: linear-gradient(135deg, #ffd700, #ff6b00); border-color: #ffd700; color: #000; }
    .rank-item.top2 .rank-number { background: linear-gradient(135deg, #c0c0c0, #888); border-color: #c0c0c0; color: #000; }
    .rank-item.top3 .rank-number { background: linear-gradient(135deg, #cd7f32, #8b4513); border-color: #cd7f32; color: #fff; }
    .rank-avatar { width: 45px; height: 45px; border-radius: 10px; border: 2px solid #00d4ff; overflow: hidden; background: linear-gradient(135deg, #00d4ff, #ff0080); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
    .rank-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .rank-info { flex: 1; min-width: 0; }
    .rank-name { font-size: 0.95rem; color: #fff; font-weight: 900; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rank-stats { font-size: 0.65rem; color: #888; font-weight: 700; }
    .rank-exp { text-align: right; flex-shrink: 0; }
    .rank-exp-value { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 900; color: #00ff88; text-shadow: 0 0 15px rgba(0, 255, 136, 0.6); }
    .rank-exp-label { font-size: 0.55rem; color: #666; font-weight: 700; text-transform: uppercase; }
    .loading { text-align: center; padding: 40px; font-size: 1rem; color: #00d4ff; font-weight: 700; }
    
    /* ✅ QUICK CARD - FIXED */
    .quick-card { 
      position: fixed; 
      top: 80px; 
      left: 15px; 
      width: 280px; 
      background: #161b22; 
      border: 3px solid #00d4ff; 
      border-radius: 16px; 
      padding: 15px; 
      box-shadow: 0 0 50px rgba(0, 212, 255, 0.6); 
      z-index: 99999; 
      transform: translateX(-320px); 
      transition: 0.3s; 
      max-height: calc(100vh - 100px); 
      overflow-y: auto; 
    }
    .quick-card.show { transform: translateX(0); }
    .quick-close { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%; background: rgba(255, 71, 87, 0.2); border: 2px solid #ff4757; color: #ff4757; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 900; }
    .quick-close:active { transform: scale(0.9); }
    .quick-avatar { width: 70px; height: 70px; border-radius: 12px; border: 3px solid #00d4ff; overflow: hidden; background: linear-gradient(135deg, #00d4ff, #ff0080); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 10px; box-shadow: 0 0 30px rgba(0, 212, 255, 0.5); }
    .quick-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .quick-name { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 900; color: #00d4ff; text-align: center; margin-bottom: 6px; text-shadow: 0 0 15px rgba(0, 212, 255, 0.8); word-break: break-word; }
    .quick-college { font-size: 0.7rem; color: #00ff88; font-weight: 700; text-align: center; margin-bottom: 8px; }
    .quick-badges { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
    .quick-badge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 10px; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 0.6rem; }
    .quick-badge.level { background: linear-gradient(135deg, #ff0080, #ff6b00); border: 1px solid #ff6b00; color: #fff; }
    .quick-badge.title { background: rgba(0, 212, 255, 0.3); border: 1px solid #00d4ff; color: #00d4ff; }
    .quick-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 12px; }
    .quick-stat { background: #0d1117; border: 1px solid rgba(0, 212, 255, 0.3); border-radius: 8px; padding: 6px 4px; text-align: center; }
    .quick-stat-icon { font-size: 0.9rem; margin-bottom: 2px; }
    .quick-stat-value { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; font-weight: 900; color: #00d4ff; }
    .quick-stat-label { font-size: 0.5rem; color: #888; text-transform: uppercase; font-weight: 700; }
    .quick-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .quick-btn { padding: 10px; border: none; border-radius: 8px; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 0.75rem; cursor: pointer; text-transform: uppercase; }
    .quick-btn.like { background: linear-gradient(135deg, #ff0064, #ff0080); border: 2px solid #ff0064; color: #fff; }
    .quick-btn.like.liked { background: #00ff88; border-color: #00ff88; color: #000; }
    .quick-btn.visit { background: linear-gradient(135deg, #00d4ff, #0099ff); border: 2px solid #00d4ff; color: #fff; }
    .quick-btn:active { transform: scale(0.95); }
    .quick-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    /* RED FIRE TABS */
    .rank-tabs {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      display: flex;
      gap: 6px;
      background: #1a0a0a;
      padding: 6px;
      border-radius: 10px;
      border: 2px solid #ff1744;
      box-shadow: 0 0 40px rgba(255, 23, 68, 0.5);
      z-index: 998;
      opacity: 0;
      animation: slideUpTabs 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards;
    }
    
    @keyframes slideUpTabs {
      to {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    }
    
    .tab-btn {
      padding: 8px 12px;
      background: rgba(255, 23, 68, 0.1);
      border: 2px solid rgba(255, 23, 68, 0.4);
      border-radius: 7px;
      color: #888;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 0.58rem;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    
    .tab-btn:active {
      transform: scale(0.92);
    }
    
    .tab-btn.active {
      background: linear-gradient(135deg, #ff1744, #ff6b00);
      border-color: #ff1744;
      color: #fff;
      box-shadow: 0 0 25px rgba(255, 23, 68, 0.8), 
                  0 0 50px rgba(255, 107, 0, 0.4),
                  inset 0 0 15px rgba(255, 255, 255, 0.2);
      animation: firePulse 1.2s ease-in-out infinite;
    }
    
    @keyframes firePulse {
      0%, 100% { 
        box-shadow: 0 0 25px rgba(255, 23, 68, 0.8), 
                    0 0 50px rgba(255, 107, 0, 0.4),
                    inset 0 0 15px rgba(255, 255, 255, 0.2);
        transform: scale(1);
      }
      50% { 
        box-shadow: 0 0 35px rgba(255, 23, 68, 1), 
                    0 0 70px rgba(255, 107, 0, 0.6),
                    inset 0 0 20px rgba(255, 255, 255, 0.3);
        transform: scale(1.03);
      }
    }
    
    .tab-btn.active::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 107, 0, 0.4) 0%, transparent 70%);
      animation: fireRotate 3s linear infinite;
      pointer-events: none;
    }
    
    @keyframes fireRotate {
      0% { transform: rotate(0deg) scale(1); opacity: 0.5; }
      50% { transform: rotate(180deg) scale(1.2); opacity: 0.8; }
      100% { transform: rotate(360deg) scale(1); opacity: 0.5; }
    }
    
    .tab-btn.active::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      width: 100%;
      background: linear-gradient(90deg, #ff1744, #ff6b00, #ffd700, #ff6b00, #ff1744);
      background-size: 200% 100%;
      animation: flameWave 1.5s linear infinite;
    }
    
    @keyframes flameWave {
      0% { background-position: 0% 0%; }
      100% { background-position: 200% 0%; }
    }
    
    /* RED FIRE BOTTOM NAV */
    .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #161b22;
        border-top: 2px solid #ff1744;
        display: flex;
        height: 58px;
        z-index: 999;
        box-shadow: 0 -5px 25px rgba(255, 23, 68, 0.4);
    }
    
    .nav-btn {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        background: none;
        border: none;
        color: #777;
        cursor: pointer;
        transition: all 0.15s ease;
        -webkit-tap-highlight-color: transparent;
    }
    
    .nav-btn:active {
        transform: scale(0.92);
    }
    
    .nav-btn.active {
        color: #ff1744;
    }
    
    .nav-btn.active i {
        color: #ff1744;
        text-shadow: 0 0 15px rgba(255, 23, 68, 0.9), 0 0 30px rgba(255, 107, 0, 0.6);
        animation: fireIconPulse 1.2s ease-in-out infinite;
    }
    
    @keyframes fireIconPulse {
      0%, 100% { 
        text-shadow: 0 0 15px rgba(255, 23, 68, 0.9), 0 0 30px rgba(255, 107, 0, 0.6);
        transform: scale(1);
      }
      50% { 
        text-shadow: 0 0 25px rgba(255, 23, 68, 1), 0 0 50px rgba(255, 107, 0, 0.8);
        transform: scale(1.12);
      }
    }
    
    .nav-btn i {
        font-size: 20px;
        transition: all 0.3s ease;
    }
    
    .nav-btn span {
        font-size: 10px;
        font-weight: 700;
        transition: all 0.3s ease;
    }
    
    .nav-btn.active span {
        color: #ff1744;
        font-weight: 900;
    }
    
    .profile-img {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid #777;
        transition: all 0.3s ease;
    }
    
    .nav-btn.active .profile-img {
        border: 2px solid #ff1744;
        box-shadow: 0 0 15px rgba(255, 23, 68, 0.7);
    }
    
    @media (min-width: 768px) {
      .navbar { padding: 14px 40px; height: 70px; }
      .logo img { width: 45px; height: 45px; }
      .logo h1 { font-size: 1.6rem; }
      .container { padding: 95px 40px; }
      .quick-card { left: 40px; }
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="navbar">
    <div class="logo" onclick="window.location.href='view.html'">
      <img src="logo.png" alt="P4X">
      <h1>NEXUS</h1>
    </div>
    <button class="back-btn" onclick="window.location.href='view.html'">← BACK</button>
  </div>
  <div class="container">
    <div class="header-card">
      <div class="header-title">🌍 GLOBAL RANKING</div>
      <div class="header-sub">TOP 99 PLAYERS WORLDWIDE</div>
    </div>
    <div class="my-rank-card" id="myRankCard" style="display:none;">
      <div class="my-rank-left">
        <div class="my-rank-label">YOUR GLOBAL RANK</div>
        <div class="my-rank-value" id="myRankValue">#0</div>
      </div>
      <div class="my-exp" id="myExpValue">0 EXP</div>
    </div>
    <div class="ranking-list" id="rankingList">
      <div class="loading">Loading rankings...</div>
    </div>
  </div>

  <!-- ✅ QUICK CARD HTML - WAPAS JODA -->
  <div class="quick-card" id="quickCard">
    <div class="quick-close" onclick="closeQuickCard()">×</div>
    <div id="quickContent">Loading...</div>
  </div>

  <!-- RANK TABS -->
  <div class="rank-tabs">
    <button class="tab-btn" id="leaderboardTab" onclick="switchTab('leaderboard')">
      <i class="fa-solid fa-trophy"></i> LEADERBOARD
    </button>
    <button class="tab-btn active" id="globalTab" onclick="switchTab('global')">
      <i class="fa-solid fa-globe"></i> GLOBAL RANK
    </button>
  </div>

  <!-- RED FIRE BOTTOM NAV -->
  <div class="bottom-nav">
    <button class="nav-btn" onclick="navClick(this, 'view')">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </button>
    <button class="nav-btn active" onclick="navClick(this, 'rank')">
      <i class="fa-solid fa-trophy"></i>
      <span>Rank</span>
    </button>
    <button class="nav-btn" onclick="navClick(this, 'wallet')">
      <i class="fa-solid fa-wallet"></i>
      <span>Wallet</span>
    </button>
    <button class="nav-btn" onclick="navClick(this, 'history')">
      <i class="fa-solid fa-clock-rotate-left"></i>
      <span>History</span>
    </button>
    <button class="nav-btn" onclick="navClick(this, 'profile')">
      <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=ProGamer" class="profile-img" id="navProfilePic" alt="Profile">
      <span>Profile</span>
    </button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDGLVLgX33dA3caK7wScbgN4BgE2NCjZx8",
      authDomain: "ffm-p4xesportscommunity.firebaseapp.com",
      projectId: "ffm-p4xesportscommunity",
      storageBucket: "ffm-p4xesportscommunity.firebasestorage.app",
      messagingSenderId: "796835743313",
      appId: "1:796835743313:web:e4356f63c3d1d51b605a70"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let currentUser = null;
    let myUID = null;

    // Particles
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; 
    canvas.height = window.innerHeight;
    const particles = [];
    for(let i = 0; i < 20; i++) {
      particles.push({
        x: Math.random() * canvas.width, 
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 1, 
        speedX: (Math.random() - 0.5) * 0.3,
        speedY: (Math.random() - 0.5) * 0.3, 
        opacity: Math.random() * 0.4 + 0.1
      });
    }
    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        ctx.beginPath(); 
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 212, 255, ${p.opacity})`; 
        ctx.fill();
        p.x += p.speedX; 
        p.y += p.speedY;
        if(p.x < 0 || p.x > canvas.width) p.speedX *= -1;
        if(p.y < 0 || p.y > canvas.height) p.speedY *= -1;
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    function calculateEXP(user) {
      const wins = user.wins || 0;
      const matches = user.matches || 0;
      const losses = Math.max(0, matches - wins);
      const diamonds = user.diamonds || 0;
      const kills = user.kills || 0;
      return (wins * 100) + (losses * 25) + (diamonds * 1) + (kills * 10);
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        myUID = user.uid;
        loadGlobalRanking();
        loadNavProfile();
      } else {
        window.location.href = 'index.html';
      }
    });

    function loadNavProfile() {
      getDoc(doc(db, 'users', myUID)).then(docSnap => {
        if (docSnap.exists() && docSnap.data().photoURL) {
          document.getElementById('navProfilePic').src = docSnap.data().photoURL;
        }
      });
    }

    async function loadGlobalRanking() {
      try {
        const usersSnap = await getDocs(collection(db, 'users'));
        let allUsers = [];
        
        usersSnap.forEach(docSnap => {
          const data = docSnap.data();
          const exp = calculateEXP(data);
          allUsers.push({
            uid: docSnap.id,
            name: data.name || 'Player',
            photoURL: data.photoURL || '',
            avatar: data.avatar || '👤',
            exp: exp,
            wins: data.wins || 0,
            matches: data.matches || 0,
            kills: data.kills || 0,
            diamonds: data.diamonds || 0,
            college: data.college || '',
            level: data.level || 1,
            equippedLeaderboardTitle: data.equippedLeaderboardTitle || null,
            likedBy: data.likedBy || []
          });
        });

        allUsers.sort((a, b) => b.exp - a.exp);
        let myRank = 0;
        let myExp = 0;
        
        allUsers.forEach((user, index) => {
          const actualRank = index + 1;
          user.displayRank = actualRank <= 999 ? actualRank : 999;
          if (user.uid === myUID) {
            myRank = user.displayRank;
            myExp = user.exp;
          }
        });

        const top99 = allUsers.slice(0, 99);
        renderRanking(top99);
        renderMyRank(myRank, myExp);
        
      } catch (e) {
        console.error('Error loading ranking:', e);
        document.getElementById('rankingList').innerHTML = '<div class="loading">Error loading rankings</div>';
      }
    }

    function renderMyRank(rank, exp) {
      const card = document.getElementById('myRankCard');
      const rankEl = document.getElementById('myRankValue');
      const expEl = document.getElementById('myExpValue');
      
      if (rank === 0) {
        card.style.display = 'none';
        return;
      }
      
      card.style.display = 'flex';
      rankEl.textContent = '#' + rank;
      expEl.textContent = exp.toLocaleString('en-IN') + ' EXP';
    }

    function renderRanking(users) {
      const listEl = document.getElementById('rankingList');
      
      if (users.length === 0) {
        listEl.innerHTML = '<div class="loading">No players found</div>';
        return;
      }

      listEl.innerHTML = '';
      
      users.forEach((user, index) => {
        const rank = index + 1;
        let rankClass = '';
        if (rank === 1) rankClass = 'top1';
        else if (rank === 2) rankClass = 'top2';
        else if (rank === 3) rankClass = 'top3';
        
        const avatar = user.photoURL 
          ? `<img src="${user.photoURL}" alt="">` 
          : user.avatar;
        
        const item = document.createElement('div');
        item.className = `rank-item ${rankClass}`;
        item.onclick = () => window.openQuickCard(user.uid); // ✅ FIX: ONCLICK WAPAS LAGAYA
        item.innerHTML = `
          <div class="rank-number">#${rank}</div>
          <div class="rank-avatar">${avatar}</div>
<div class="rank-info">
  <div class="rank-name">${user.name}</div>

  ${user.equippedLeaderboardTitle ? `
    <div style="
      display:inline-flex;
      align-items:center;
      gap:4px;
      background:rgba(255,0,0,0.25);
      border:1px solid #ff1744;
      padding:2px 7px;
      border-radius:8px;
      font-size:0.58rem;
      font-weight:900;
      color:#fff;
      margin-bottom:4px;
      margin-top:2px;
    ">
      ${user.equippedLeaderboardTitle.icon || ''} ${user.equippedLeaderboardTitle.name}
    </div>
  ` : ''}

  <div class="rank-stats">
    ${user.wins}W ${user.matches}M ${user.kills}K
  </div>
</div>
          <div class="rank-exp">
            <div class="rank-exp-value">${user.exp.toLocaleString('en-IN')}</div>
            <div class="rank-exp-label">EXP</div>
          </div>
        `;
        listEl.appendChild(item);
      });
    }

    // ✅ QUICK CARD FUNCTIONS - WAPAS JODE
    const LEVEL_TYPES = {
      1: { name: 'COLLEGE', icon: '🎓' },
      2: { name: 'UNIVERSITY', icon: '🏛️' },
      3: { name: 'ZONAL', icon: '⭐' },
      4: { name: 'DISTRICT', icon: '🏅' },
      5: { name: 'STATE', icon: '👑' }
    };

    window.openQuickCard = async function(uid) {
      const card = document.getElementById('quickCard');
      const content = document.getElementById('quickContent');
      card.classList.add('show');
      content.innerHTML = '<div style="text-align:center;padding:20px;">Loading...</div>';

      try {
        const userSnap = await getDoc(doc(db, 'users', uid));
        if (!userSnap.exists()) {
          content.innerHTML = '<div style="text-align:center;padding:20px;color:#ff4757;">User not found</div>';
          return;
        }

        const userData = userSnap.data();
        const levelData = LEVEL_TYPES[userData.level || 1];
        const lbTitle = userData.equippedLeaderboardTitle;
        const likedBy = userData.likedBy || [];
        const isLiked = auth.currentUser && likedBy.includes(auth.currentUser.uid);
        const isOwnProfile = auth.currentUser && auth.currentUser.uid === uid;

        content.innerHTML = `
          <div class="quick-avatar">
            ${userData.photoURL? `<img src="${userData.photoURL}" alt="">` : '👤'}
          </div>
          <div class="quick-name">${userData.name || 'Player'}</div>
          ${userData.college? `<div class="quick-college">🎓 ${userData.college}</div>` : ''}
          <div class="quick-badges">
            <div class="quick-badge level">
              <span>${levelData.icon}</span>
              <span>${levelData.name}</span>
            </div>
            ${lbTitle? `<div class="quick-badge title"><span>👑</span><span>${lbTitle.name}</span></div>` : ''}
          </div>
          <div class="quick-stats">
            <div class="quick-stat"><div class="quick-stat-icon">💀</div><div class="quick-stat-value">${(userData.kills || 0).toLocaleString('en-IN')}</div><div class="quick-stat-label">KILLS</div></div>
            <div class="quick-stat"><div class="quick-stat-icon">⚔️</div><div class="quick-stat-value">${(userData.matches || 0).toLocaleString('en-IN')}</div><div class="quick-stat-label">MATCHES</div></div>
            <div class="quick-stat"><div class="quick-stat-icon">🏆</div><div class="quick-stat-value">${(userData.wins || 0).toLocaleString('en-IN')}</div><div class="quick-stat-label">WINS</div></div>
            <div class="quick-stat"><div class="quick-stat-icon">💎</div><div class="quick-stat-value">${(userData.diamonds || 0).toLocaleString('en-IN')}</div><div class="quick-stat-label">DIAMONDS</div></div>
          </div>
          <div class="quick-btns">
            <button class="quick-btn like ${isLiked? 'liked' : ''}" onclick="toggleLikeQuick('${uid}')" ${isOwnProfile? 'disabled' : ''}>
              ${isOwnProfile? 'YOUR PROFILE' : isLiked? '✓ LIKED' : '❤️ LIKE'}
            </button>
            <button class="quick-btn visit" onclick="window.location.href='view-profile.html?uid=${uid}'">👤 VISIT</button>
          </div>
        `;
      } catch (e) {
        console.error(e);
        content.innerHTML = '<div style="text-align:center;padding:20px;color:#ff4757;">Error loading</div>';
      }
    }

     window.closeQuickCard = function() {
      document.getElementById('quickCard').classList.remove('show');
    }

    window.toggleLikeQuick = async function(uid) {
      if (!auth.currentUser) {
        alert('Login to like profiles');
        return;
      }
      if (auth.currentUser.uid === uid) return;

      try {
        const userRef = doc(db, 'users', uid);
        const userSnap = await getDoc(userRef);
        const likedBy = userSnap.data().likedBy || [];

        if (likedBy.includes(auth.currentUser.uid)) {
          await updateDoc(userRef, { likedBy: arrayRemove(auth.currentUser.uid) });
        } else {
          await updateDoc(userRef, { likedBy: arrayUnion(auth.currentUser.uid) });
        }
        openQuickCard(uid); // Refresh card
      } catch (e) {
        console.error(e);
        alert('Error updating like');
      }
    }

    // ✅ TAB SWITCH
    window.switchTab = function(tab) {
      if (tab === 'leaderboard') {
        window.location.href = 'leaderboard.html';
      } else {
        window.location.href = 'rank.html';
      }
    }

    // ✅ BOTTOM NAV CLICK
    window.navClick = function(btn, page) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      if(page === 'rank') return;
      window.location.href = page + '.html';
    }
    
    globalThis.navClick = window.navClick;
globalThis.switchTab = window.switchTab;
globalThis.openQuickCard = window.openQuickCard;
globalThis.closeQuickCard = window.closeQuickCard;
globalThis.toggleLikeQuick = window.toggleLikeQuick;

    // ✅ Click outside to close card
    document.addEventListener('click', function(e) {
      const card = document.getElementById('quickCard');
      const isClickInsideCard = card.contains(e.target);
      const isClickOnRankItem = e.target.closest('.rank-item');
      
      if (!isClickInsideCard && !isClickOnRankItem && card.classList.contains('show')) {
        closeQuickCard();
      }
    });
  </script>
</body>
</html>
