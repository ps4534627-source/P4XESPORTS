<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MATCH HISTORY - FFM-P4X</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none !important; }
    html, body { overflow-x: hidden; width: 100%; position: relative; }
    body {
      font-family: 'Rajdhani', sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 50%, #0a0a 100%);
      color: #fff;
      min-height: 100vh;
      padding: 10px;
      padding-bottom: 90px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border: 2px solid #00d4ff;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
    }
    .header-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      color: #00d4ff;
      text-shadow: 0 20px rgba(0, 212, 255, 1);
      letter-spacing: 2px;
    }
    .back-btn {
      padding: 10px 18px;
      background: linear-gradient(135deg, #00d4ff, #0099cc);
      border: none;
      border-radius: 10px;
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 0.75rem;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
      transition: all 0.3s;
    }
    .back-btn:active { transform: scale(0.95); }
    .profile-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff0080, #ff6b00);
      border: 3px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 0, 128, 0.6);
      transition: all 0.3s;
    }
    .profile-btn:active { transform: scale(0.9); }
    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      text-align: center;
      margin-bottom: 8px;
      color: #00d4ff;
      text-shadow: 0 0 30px rgba(0, 212, 255, 1);
      letter-spacing: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .section-subtitle {
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    .summary-card {
      background: linear-gradient(135deg, #161b22, #0d1117);
      border: 3px solid #ff6b00;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 0 40px rgba(255, 107, 0, 0.4);
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .summary-item {
      text-align: center;
      padding: 12px 8px;
      background: rgba(255, 107, 0, 0.1);
      border-radius: 12px;
      border: 1px solid rgba(255, 107, 0, 0.3);
    }
    .summary-icon { font-size: 1.5rem; margin-bottom: 6px; }
    .summary-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 900;
      color: #ff6b00;
      text-shadow: 0 0 15px rgba(255, 107, 0, 1);
      margin-bottom: 4px;
    }
    .summary-label {
      font-size: 0.65rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
    }
    .history-list { display: flex; flex-direction: column; gap: 15px; }
    .match-card {
      background: linear-gradient(135deg, #1a1a2e 0%, #0f1419 100%);
      border: 3px solid;
      border-radius: 18px;
      padding: 18px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
    }
    .match-card.win { border-color: #00ff88; box-shadow: 0 0 35px rgba(0, 255, 136, 0.4); }
    .match-card.win.mvp { border-color: #ffd700; box-shadow: 0 0 45px rgba(255, 215, 0, 0.6); }
    .match-card.lose { border-color: #ff4757; box-shadow: 0 0 35px rgba(255, 71, 87, 0.4); }
    .match-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
    }
    .match-card.win::before { background: linear-gradient(90deg, #00ff88, #00d4ff); }
    .match-card.win.mvp::before { background: linear-gradient(90deg, #ffd700, #ff6b00, #ff0080); }
    .match-card.lose::before { background: linear-gradient(90deg, #ff4757, #ff6b00); }
    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
      gap: 12px;
    }
    .match-left { flex: 1; }
    .match-type {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .match-mode {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 900;
      color: #00d4ff;
      text-shadow: 0 0 15px rgba(0, 212, 255, 1);
    }
    .match-map { font-size: 0.85rem; color: #00ff88; font-weight: 700; }
    .match-venue { font-size: 0.75rem; color: #888; margin-bottom: 4px; }
    .match-date { font-size: 0.75rem; color: #666; }
    .rank-badge {
      padding: 10px 16px;
      border-radius: 12px;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 20px;
      flex-shrink: 0;
    }
    .rank-badge.win {
      background: linear-gradient(135deg, #00ff88, #00d4ff);
      color: #000;
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.7);
    }
    .rank-badge.lose {
      background: linear-gradient(135deg, #ff4757, #ff6b00);
      color: #fff;
      box-shadow: 0 0 25px rgba(255, 71, 87, 0.7);
    }
    .performance-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 900;
      margin-top: 10px;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 1px;
    }
    .performance-tag.mvp {
      background: linear-gradient(135deg, #ffd700, #ff6b00);
      color: #000;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
      animation: glow 2s ease-in-out infinite;
    }
    .performance-tag.second {
      background: linear-gradient(135deg, #c0c0c0, #a8);
      color: #000;
      box-shadow: 0 0 20px rgba(192, 192, 0.7);
    }
    .performance-tag.third {
      background: linear-gradient(135deg, #cd7f32, #b87333);
      color: #fff;
      box-shadow: 0 0 20px rgba(205, 127, 50, 0.7);
    }
    .performance-tag.normal {
      background: linear-gradient(135deg, #00d4ff, #0099cc);
      color: #000;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 25px rgba(255, 215, 0, 0.8); }
      50% { box-shadow: 0 0 40px rgba(255, 215, 0, 1); }
    }
    .match-info {
      background: rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid rgba(0, 212, 255, 0.2);
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }
    .info-row:last-child { margin-bottom: 0; }
    .info-label { color: #888; font-weight: 700; }
    .info-value { color: #fff; font-weight: 700; }
    .match-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .stat {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
      border: 1px solid rgba(0, 212, 255, 0.2);
    }
    .stat-icon { font-size: 1.3rem; margin-bottom: 6px; }
    .stat-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      color: #00ff88;
      text-shadow: 0 0 15px rgba(0, 255, 136, 1);
      margin-bottom: 4px;
    }
    .stat-label {
      font-size: 0.6rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
    }
    .prize-section {
      background: rgba(0, 255, 136, 0.1);
      border: 2px solid rgba(0, 255, 136, 0.3);
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
    }
    .prize-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 900;
      color: #00ff88;
      margin-bottom: 10px;
      text-align: center;
      letter-spacing: 1px;
    }
    .prize-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .prize-item {
      background: rgba(0, 0, 0.6);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .prize-label {
      font-size: 0.65rem;
      color: #888;
      margin-bottom: 6px;
      text-transform: uppercase;
      font-weight: 700;
    }
    .prize-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 900;
      color: #00ff88;
      text-shadow: 0 0 15px rgba(0, 255, 136, 1);
    }
    .profit-badge {
      background: linear-gradient(135deg, #ffd700, #ff6b00);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
    }
    .profit-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 900;
      color: #000;
      letter-spacing: 1px;
    }
    .profit-value {
      font-size: 1.1rem;
      margin-top: 4px;
    }
    .match-desc {
      background: rgba(0, 212, 255, 0.08);
      border-left: 4px solid #00d4ff;
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: #aaa;
      line-height: 1.6;
    }
    .desc-label {
      font-size: 0.7rem;
      color: #00d4ff;
      font-weight: 900;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }
    .empty-icon { font-size: 4rem; margin-bottom: 15px; opacity: 0.3; }
    .empty-text { font-size: 1.1rem; font-weight: 700; }
    .booyah-banner {
      width: 100%;
      max-width: 300px;
      height: 80px;
      margin: 0 auto 15px auto;
      display: none;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffd700, #ff6b00);
      border-radius: 15px;
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.8);
      animation: booyahGlow 2s ease-in-out infinite;
    }
    .booyah-banner.show {
      display: flex;
    }
    .booyah-banner img {
      max-width: 280px;
      max-height: 70px;
      object-fit: contain;
    }
    @keyframes booyahGlow {
      0%, 100% { box-shadow: 0 0 40px rgba(255, 215, 0, 0.8); transform: scale(1); }
      50% { box-shadow: 0 0 60px rgba(255, 215, 0, 1); transform: scale(1.02); }
    }
    
    /* ✅ ORANGE FIRE BOTTOM NAV */
    .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #161b22;
        border-top: 2px solid #ff6b00;
        display: flex;
        height: 58px;
        z-index: 999;
        box-shadow: 0 -5px 25px rgba(255, 107, 0, 0.4);
    }
    
    .nav-btn {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        background: none;
        border: none;
        color: #777;
        cursor: pointer;
        transition: all 0.15s ease;
        -webkit-tap-highlight-color: transparent;
    }
    
    .nav-btn:active {
        transform: scale(0.92);
    }
    
    .nav-btn.active {
        color: #ff6b00;
    }
    
    .nav-btn.active i {
        color: #ff6b00;
        text-shadow: 0 0 15px rgba(255, 107, 0, 0.9), 0 30px rgba(255, 140, 0, 0.6);
        animation: orangeIconPulse 1.2s ease-in-out infinite;
    }
    
    @keyframes orangeIconPulse {
      0%, 100% { 
        text-shadow: 0 0 15px rgba(255, 107, 0, 0.9), 0 30px rgba(255, 140, 0, 0.6);
        transform: scale(1);
      }
      50% { 
        text-shadow: 0 0 25px rgba(255, 107, 0, 1), 0 50px rgba(255, 140, 0, 0.8);
        transform: scale(1.12);
      }
    }
    
    .nav-btn i {
        font-size: 20px;
        transition: all 0.3s ease;
    }
    
    .nav-btn span {
        font-size: 10px;
        font-weight: 700;
        transition: all 0.3s ease;
    }
    
    .nav-btn.active span {
        color: #ff6b00;
        font-weight: 900;
    }
    
    .profile-img {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid #777;
        transition: all 0.3s ease;
    }
    
    .nav-btn.active .profile-img {
        border: 2px solid #ff6b00;
        box-shadow: 0 0 15px rgba(255, 107, 0, 0.7);
    }
    
    @media (max-width: 400px) {
      .summary-grid { grid-template-columns: repeat(2, 1fr); }
      .match-stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="history.back()">← BACK</button>
    <div class="header-title">MATCH HISTORY</div>
    <div class="profile-btn" onclick="window.location.href='profile.html'">👤</div>
  </div>

  <div class="section-title">
    <span>⚔️</span>
    <span>BATTLE RECORDS</span>
  </div>
  <div class="section-subtitle">Your Complete Match History</div>

  <div class="summary-card">
    <div class="summary-grid">
      <div class="summary-item">
        <div class="summary-icon">🏆</div>
        <div class="summary-value" id="totalWins">0</div>
        <div class="summary-label">TOTAL WINS</div>
      </div>
      <div class="summary-item">
        <div class="summary-icon">💀</div>
        <div class="summary-value" id="totalKills">0</div>
        <div class="summary-label">TOTAL KILLS</div>
      </div>
      <div class="summary-item">
        <div class="summary-icon">⚔️</div>
        <div class="summary-value" id="totalMatches">0</div>
        <div class="summary-label">MATCHES</div>
      </div>
      <div class="summary-item">
        <div class="summary-icon">💎</div>
        <div class="summary-value" id="totalDiamonds">0</div>
        <div class="summary-label">DIAMONDS</div>
      </div>
    </div>
  </div>

  <div class="history-list" id="historyList">
    <div class="empty-state">
      <div class="empty-icon">📊</div>
      <div class="empty-text">Loading matches...</div>
    </div>
  </div>

  <!-- ✅ ORANGE FIRE BOTTOM NAV -->
  <div class="bottom-nav">
    <button class="nav-btn" onclick="navClick(this, 'view')">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </button>
    <button class="nav-btn" onclick="navClick(this, 'rank')">
      <i class="fa-solid fa-trophy"></i>
      <span>Rank</span>
    </button>
    <button class="nav-btn" onclick="navClick(this, 'wallet')">
      <i class="fa-solid fa-wallet"></i>
      <span>Wallet</span>
    </button>
    <button class="nav-btn active" onclick="navClick(this, 'history')">
      <i class="fa-solid fa-clock-rotate-left"></i>
      <span>History</span>
    </button>
    <button class="nav-btn" onclick="navClick(this, 'profile')">
      <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=ProGamer" class="profile-img" id="navProfilePic" alt="Profile">
      <span>Profile</span>
    </button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDGLVLgX33dA3caK7wScbgN4BgE2NCjZx8",
      authDomain: "ffm-p4xesportscommunity.firebaseapp.com",
      projectId: "ffm-p4xesportscommunity",
      storageBucket: "ffm-p4xesportscommunity.firebasestorage.app",
      messagingSenderId: "796835743313",
      appId: "1:796835743313:web:e4356f63c3d1d51b605a70"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      loadMatchHistory(user.uid);
      loadNavProfile(user.uid);
    });

    function loadNavProfile(uid) {
      getDoc(doc(db, 'users', uid)).then(docSnap => {
        if (docSnap.exists() && docSnap.data().photoURL) {
          document.getElementById('navProfilePic').src = docSnap.data().photoURL;
        }
      });
    }

    async function loadMatchHistory(uid) {
      const listEl = document.getElementById('historyList');
      
      try {
        const q = query(collection(db, 'matchHistory'), where('userId', '==', uid));
        const snap = await getDocs(q);
        
        if (snap.empty) {
          listEl.innerHTML = '<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-text">No matches played yet</div></div>';
          return;
        }
        
        let totalWins = 0, totalKills = 0, totalDiamonds = 0;
        const docs = [];
        snap.forEach(doc => {
          docs.push({ id: doc.id, ...doc.data() });
        });
        
        docs.sort((a, b) => {
          const timeA = a.matchDate ? a.matchDate.toMillis() : 0;
          const timeB = b.matchDate ? b.matchDate.toMillis() : 0;
          return timeB - timeA;
        });
        
        let html = '';
        docs.forEach(m => {
          if (m.rank === 1) totalWins++;
          totalKills += m.kills || 0;
          totalDiamonds += m.diamondsWon || 0;
          
          const cardClass = m.rank === 1 ? (m.isMVP ? 'match-card win mvp' : 'match-card win') : 'match-card lose';
          const rankClass = m.rank === 1 ? 'win' : 'lose';
          const rankIcon = m.rank === 1 ? '🏆' : '💀';
          
          let perfTag = '';
          if (m.performance === 'MVP') perfTag = '<div class="performance-tag mvp"><span>👑</span><span>MVP - Most Valuable</span></div>';
          else if (m.performance === '2nd') perfTag = '<div class="performance-tag second"><span>🥈</span><span>2nd PLACE</span></div>';
          else if (m.performance === '3rd') perfTag = '<div class="performance-tag third"><span>🥉</span><span>3rd PLACE</span></div>';
          else perfTag = `<div class="performance-tag normal"><span>⚔️</span><span>${m.performance || 'N/A'} PLACE</span></div>`;
          
          const profitDiamonds = (m.diamondsWon || 0) - (m.entryFeeDiamonds || 0);
          const profitINR = (m.inrWon || 0) - (m.entryFeeINR || 0);
          
          const booyahHTML = m.rank === 1 ? `
            <div class="booyah-banner show">
              <img src="https://i.ibb.co/W4542Vr3/20260416-092421.png" alt="BOOYAH!" onerror="this.parentElement.style.display='none'">
            </div>
          ` : '';
          
          html += `
            ${booyahHTML}
            <div class="${cardClass}">
              <div class="match-header">
                <div class="match-left">
                  <div class="match-type">
                    <span class="match-mode">${m.matchType || 'N/A'}</span>
                  </div>
                  <div class="match-map">🗺️ ${m.map || 'Unknown'}</div>
                  <div class="match-venue">📍 ${m.venue || 'Online'}</div>
                  <div class="match-date">${m.matchDate ? new Date(m.matchDate.toDate()).toLocaleString('en-IN', {day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}) : 'N/A'}</div>
                  ${perfTag}
                </div>
                <div class="rank-badge ${rankClass}">
                  <span>${rankIcon}</span>
                  <span>RANK #${m.rank || 'N/A'}</span>
                </div>
              </div>
              
              <div class="match-info">
                <div class="info-row">
                  <span class="info-label">Entry Fee:</span>
                  <span class="info-value">₹ ${m.entryFeeINR || 0}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">Prize Pool:</span>
                  <span class="info-value">💎 ${m.prizePoolDiamonds || 0} | ₹ ${m.prizePoolINR || 0}</span>
                </div>
              </div>
              
              <div class="match-stats">
                <div class="stat">
                  <div class="stat-icon">💀</div>
                  <div class="stat-value">${m.kills || 0}</div>
                  <div class="stat-label">KILLS</div>
                </div>
                <div class="stat">
                  <div class="stat-icon">⚔️</div>
                  <div class="stat-value">${(m.damage || 0).toLocaleString('en-IN')}</div>
                  <div class="stat-label">DAMAGE</div>
                </div>
                <div class="stat">
                  <div class="stat-icon">💎</div>
                  <div class="stat-value">${m.diamondsWon || 0}</div>
                  <div class="stat-label">DIAMONDS</div>
                </div>
                <div class="stat">
                  <div class="stat-icon">₹</div>
                  <div class="stat-value">${m.inrWon || 0}</div>
                  <div class="stat-label">INR</div>
                </div>
              </div>
              
              ${m.rank === 1 ? `
              <div class="prize-section">
                <div class="prize-title">💰 EARNINGS THIS MATCH</div>
                <div class="prize-grid">
                  <div class="prize-item">
                    <div class="prize-label">DIAMONDS WON</div>
                    <div class="prize-value">💎 +${m.diamondsWon || 0}</div>
                  </div>
                  <div class="prize-item">
                    <div class="prize-label">INR WON</div>
                    <div class="prize-value">₹ +${m.inrWon || 0}</div>
                  </div>
                </div>
                <div class="profit-badge">
                  <div class="profit-text">🎉 NET PROFIT</div>
                  <div class="profit-text profit-value">💎 ${profitDiamonds} | ₹ ${profitINR}</div>
                </div>
              </div>
              ` : ''}
              
              ${m.description ? `
              <div class="match-desc">
                <div class="desc-label">📝 MATCH DESCRIPTION:</div>
                ${m.description}
              </div>
              ` : ''}
            </div>
          `;
        });
        
        listEl.innerHTML = html;
        document.getElementById('totalWins').textContent = totalWins;
        document.getElementById('totalKills').textContent = totalKills;
        document.getElementById('totalMatches').textContent = snap.size;
        document.getElementById('totalDiamonds').textContent = totalDiamonds > 999 ? (totalDiamonds/1000).toFixed(1) + 'K' : totalDiamonds;
        
      } catch (e) {
        console.error(e);
        listEl.innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><div class="empty-text">Error loading history</div></div>';
      }
    }

    // ✅ BOTTOM NAV CLICK
    window.navClick = function(btn, page) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      if(page === 'history') return;
      window.location.href = page + '.html';
    }
  </script>
</body>
</html>
