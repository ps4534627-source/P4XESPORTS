<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team - FFM-P4X NEXUS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { font-family:'Rajdhani',sans-serif; background:#0d1117; color:#fff; min-height:100vh; padding-bottom:80px; }
    #loadingScreen { position:fixed; inset:0; background:#0d1117; z-index:5000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; }
    .loader-logo { font-family:'Orbitron',sans-serif; font-size:1.8rem; font-weight:900; color:#00d4ff; text-shadow:0 0 25px rgba(0,212,255,0.8); letter-spacing:2px; animation:pulseLogo 1.4s ease-in-out infinite; }

    .loader-ring { width:60px; height:60px; border:5px solid rgba(0,212,255,0.2); border-top-color:#00d4ff; border-radius:50%; animation:spin 0.9s linear infinite; }

    .loader-text { font-size:0.9rem; color:#888; font-weight:700; letter-spacing:1px; }

    .navbar { position:fixed; top:0; left:0; right:0; z-index:1000; background:rgba(22,27,34,0.98); backdrop-filter:blur(10px); border-bottom:2px solid #00d4ff; padding:8px 12px; display:flex; justify-content:space-between; align-items:center; height:60px; }
    .nav-left { display:flex; align-items:center; gap:12px; }
    .back-btn { background:linear-gradient(135deg,#00d4ff,#0099ff); border:2px solid #00d4ff; padding:6px 14px; border-radius:8px; color:#fff; font-weight:900; font-size:0.8rem; cursor:pointer; font-family:'Orbitron',sans-serif; }
    .back-btn:active { transform:scale(0.95); }
    .nav-title { font-family:'Orbitron',sans-serif; font-size:1.3rem; font-weight:900; color:#00d4ff; letter-spacing:1px; }
    .nav-right { display:flex; align-items:center; gap:10px; }
    .create-team-btn { background:linear-gradient(135deg,#00ff88,#00cc66); border:2px solid #00ff88; padding:6px 12px; border-radius:8px; color:#000; font-weight:900; font-size:0.75rem; cursor:pointer; font-family:'Orbitron',sans-serif; }
    .leave-btn { background:linear-gradient(135deg,#ff6b00,#ff4757); border:2px solid #ff6b00; padding:6px 12px; border-radius:8px; color:#fff; font-weight:900; font-size:0.75rem; cursor:pointer; font-family:'Orbitron',sans-serif; }
    .delete-btn { background:linear-gradient(135deg,#ff4757,#ff0064); border:2px solid #ff4757; padding:6px 12px; border-radius:8px; color:#fff; font-weight:900; font-size:0.75rem; cursor:pointer; font-family:'Orbitron',sans-serif; }

    .profile-section { position:relative; cursor:pointer; }

    .profile-btn img { width:100%; height:100%; object-fit:cover; }
    .dropdown { position:absolute; top:50px; right:0; background:#161b22; border:2px solid #00d4ff; border-radius:12px; min-width:200px; box-shadow:0 0 50px rgba(0,212,255,0.5); opacity:0; visibility:hidden; transform:translateY(-10px); transition:0.3s; z-index:1001; }

    .container { max-width:900px; margin:0 auto; padding:75px 15px 20px 15px; }
    .hidden { display:none !important; }

    .search-section { background:rgba(22,27,34,0.9); border:2px solid #00d4ff; border-radius:16px; padding:20px; margin-bottom:20px; }

    .team-result { background:#0d1117; border:1px solid rgba(0,212,255,0.3); border-radius:8px; padding:10px; margin-bottom:8px; display:flex; align-items:center; gap:10px; }
    .team-result-avatar { width:45px; height:45px; border-radius:8px; border:2px solid #00d4ff; overflow:hidden; flex-shrink:0; background:#161b22; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:1.2rem; }

    .random-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; }

    .random-join-btn.requested { background:rgba(136,136,136,0.1); border:2px solid #666; color:#888; cursor:default; }
    .random-empty { text-align:center; color:#666; padding:20px; font-size:0.85rem; grid-column:1/-1; }

    .invites-section { background:rgba(22,27,34,0.9); border:2px solid rgba(255,107,0,0.5); border-radius:16px; padding:20px; margin-bottom:20px; }
    .invites-title { font-family:'Orbitron',sans-serif; font-size:1rem; font-weight:900; color:#ff6b00; margin-bottom:15px; }
    .invite-card { background:#0d1117; border:2px solid rgba(255,107,0,0.3); border-radius:10px; padding:12px; margin-bottom:10px; display:flex; align-items:center; gap:10px; }
    .invite-logo { width:45px; height:45px; border-radius:8px; border:2px solid #ff6b00; overflow:hidden; flex-shrink:0; background:#161b22; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:1.2rem; }
    .invite-logo img { width:100%; height:100%; object-fit:cover; }
    .invite-info { flex:1; min-width:0; }

    .invite-members { font-size:0.7rem; color:#888; }
    .invite-actions { display:flex; gap:6px; flex-shrink:0; }
    .invite-accept-btn { padding:7px 10px; background:linear-gradient(135deg,#00ff88,#00cc66); border:2px solid #00ff88; border-radius:6px; color:#000; font-weight:900; font-size:0.65rem; cursor:pointer; font-family:'Orbitron',sans-serif; }
    .invite-reject-btn { padding:7px 10px; background:rgba(255,71,87,0.15); border:2px solid #ff4757; border-radius:6px; color:#ff4757; font-weight:900; font-size:0.65rem; cursor:pointer; font-family:'Orbitron',sans-serif; }

    .team-popup-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:3000; display:flex; align-items:center; justify-content:center; padding:15px; opacity:0; visibility:hidden; transition:0.3s; }
    .team-popup-overlay.show { opacity:1; visibility:visible; }
    .team-popup { background:#161b22; border:3px solid #00d4ff; border-radius:20px; width:100%; max-width:420px; max-height:88vh; overflow-y:auto; box-shadow:0 0 80px rgba(0,212,255,0.5); transform:scale(0.9); transition:0.3s; position:relative; }
    .team-popup-overlay.show .team-popup { transform:scale(1); }
    .team-popup-close { position:absolute; top:10px; right:10px; width:28px; height:28px; border-radius:50%; background:rgba(255,71,87,0.2); border:2px solid #ff4757; color:#ff4757; font-size:1.1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:900; z-index:5; }
    .team-popup-cover { width:100%; height:120px; object-fit:cover; display:block; border-radius:17px 17px 0 0; background:linear-gradient(135deg,#00d4ff,#ff0080); }
    .team-popup-dp-wrap { display:flex; justify-content:center; margin-top:-35px; margin-bottom:8px; position:relative; z-index:2; }
    /* ISSUE 3: enlarged DP by 50% */
    .team-popup-dp {
      width:105px;

      border-radius:50%;
      border:4px solid #161b22;

      align-items:center;
      justify-content:center;
      font-size:2rem;
      box-shadow:0 0 30px rgba(0,212,255,0.6);
    }
    .team-popup-dp img { width:100%; height:100%; object-fit:cover; }
    .team-popup-info { text-align:center; padding:0 20px 12px; }
    .team-popup-name { font-family:'Orbitron',sans-serif; font-size:1.1rem; font-weight:900; color:#fff; margin-bottom:3px; }
    .team-popup-username { font-size:0.8rem; color:#888; margin-bottom:8px; }
    .team-popup-slots { display:inline-flex; align-items:center; gap:6px; background:rgba(0,255,136,0.1); border:1px solid #00ff88; border-radius:20px; padding:4px 12px; font-size:0.75rem; font-weight:900; color:#00ff88; }
    .team-popup-members-title { font-family:'Orbitron',sans-serif; font-size:0.85rem; font-weight:900; color:#00d4ff; margin-bottom:10px; padding:0 15px; }
    .team-popup-members { padding:0 12px 12px; display:flex; flex-direction:column; gap:8px; }
    .team-popup-member { background:#0d1117; border:1px solid rgba(0,212,255,0.3); border-radius:8px; padding:10px; display:flex; align-items:center; gap:10px; cursor:pointer; transition:0.2s; }
    .team-popup-member:active { border-color:#00d4ff; background:rgba(0,212,255,0.05); }
    .team-popup-member-av { width:36px; height:36px; border-radius:8px; border:2px solid #00d4ff; overflow:hidden; flex-shrink:0; background:linear-gradient(135deg,#00d4ff,#ff0080); display:flex; align-items:center; justify-content:center; font-size:1rem; }
    .team-popup-member-av img { width:100%; height:100%; object-fit:cover; }
    .team-popup-member-name { font-size:0.85rem; font-weight:900; color:#fff; }
    /* ISSUE 4: show actual role + crown for owner */
    .team-popup-member-role { font-size:0.65rem; color:#00ff88; font-weight:700; }
    .team-popup-btns { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 12px 15px; }
    .team-popup-join-btn { padding:12px; background:linear-gradient(135deg,#00ff88,#00cc66); border:none; border-radius:10px; color:#000; font-weight:900; font-size:0.85rem; cursor:pointer; font-family:'Orbitron',sans-serif; }
    .team-popup-join-btn.disabled-state { background:rgba(136,136,136,0.15); border:2px solid #555; color:#888; cursor:default; }
    .team-popup-join-btn.full-state { background:rgba(255,71,87,0.15); border:2px solid #ff4757; color:#ff4757; cursor:default; }
    .team-popup-cancel-btn { padding:12px; background:transparent; border:2px solid rgba(255,255,255,0.2); border-radius:10px; color:#888; font-weight:900; font-size:0.85rem; cursor:pointer; font-family:'Orbitron',sans-serif; }

    /* … rest of CSS unchanged … */

  </style>
</head>
<body>

          <div class="dropdown-item" onclick="window.location.href='wallet.html'">💰 Wallet</div>

  <!-- TEAM VIEW -->

    <!-- ISSUE 1: Renamed header -->

  <!-- POPUPS, QUICK CARD, CREATE POPUP … unchanged -->

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
      onSnapshot, collection, query, where, getDocs,
      arrayUnion, arrayRemove, runTransaction, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDGLVLgX33dA3caK7wScbgN4BgE2NCjZx8",
      authDomain: "ffm-p4xesportscommunity.firebaseapp.com",
      projectId: "ffm-p4xesportscommunity",
      storageBucket: "ffm-p4xesportscommunity.firebasestorage.app",
      messagingSenderId: "796835743313",
      appId: "1:796835743313:web:e4356f63c3d1d51b605a70"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const TEAM_COST = 20;
    const MAX_MEMBERS = 5;
    const ROLES = ['IGL','Rusher','Sniper','Assaulter','Supporter','Primary Rusher','Default'];
    const LEVEL_TYPES = {
      1:{name:'COLLEGE',icon:'🎓'},
      2:{name:'UNIVERSITY',icon:'🏛️'},
      3:{name:'ZONAL',icon:'⭐'},
      4:{name:'DISTRICT',icon:'🏅'},
      5:{name:'STATE',icon:'👑'}
    };

    let currentUser = null;
    let myData = null;
    let myTeamId = null;
    let teamUnsub = null;
    let userUnsub = null;
    let membersUnsub = null;
    let currentTeam = null;
    let currentMembers = [];
    let isOwner = false;
    let pendingConfirmAction = null;
    let createBgData = null, createDpData = null;
    let currentEditingPosition = null;
    let currentMenuPosition = null;
    let refreshCooldown = false;
    let refreshTimer = null;
    let loadingHidden = false;
    let isDeletingTeam = false;

    /* ===== SAFE HIDE LOADING ===== */
    function hideLoading() {
      if (loadingHidden) return;
      loadingHidden = true;
      const ls = document.getElementById('loadingScreen');
      if (ls) ls.style.display = 'none';
      const nb = document.getElementById('navbar');
      if (nb) nb.classList.remove('hidden');
    }

    /* ===== PROFILE DROPDOWN ===== */
    window.toggleProfileDropdown = function() {
      document.getElementById('profileDropdown').classList.toggle('show');
    };
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.profile-section')) {
        const dd = document.getElementById('profileDropdown');
        if (dd) dd.classList.remove('show');
      }
    });
    window.doLogout = async function() {
      if (confirm('Logout karna chahte ho?')) {
        if (userUnsub) userUnsub();
        if (teamUnsub) teamUnsub();
        if (membersUnsub) membersUnsub();
        await signOut(auth);
        window.location.href = 'index.html';
      }
    };

    /* ===== SAFETY TIMEOUT ===== */
    const safetyTimeout = setTimeout(() => {
      if (!loadingHidden) {
        console.warn('Safety timeout — forcing loading hide');
        showNoTeamView();
      }
    }, 10000);

    /* ===== AUTH ===== */
    onAuthStateChanged(auth, async (user) => {
      clearTimeout(safetyTimeout);
      if (!user) { window.location.href = 'index.html'; return; }
      currentUser = user;
      try {
        const userRef = doc(db, 'users', currentUser.uid);
        const userSnap = await getDoc(userRef);
        if (!userSnap.exists()) {
          await setDoc(userRef, {
            name: currentUser.displayName || 'Player',
            email: currentUser.email || '',
            photoURL: currentUser.photoURL || '',
            balance: 0, diamonds: 0, wallet: 0,
            kills: 0, wins: 0, matches: 0, rank: 0, p4x_coins: 0,
            teamId: null,
            friends: [], friendRequests: [], sentRequests: [],
            teamInvites: [], likedBy: [],
            online: true, createdAt: serverTimestamp()
          });
        } else {
          const data = userSnap.data();
          const missing = {};
          if (!Array.isArray(data.teamInvites)) missing.teamInvites = [];
          if (!Array.isArray(data.friends)) missing.friends = [];
          if (!Array.isArray(data.friendRequests)) missing.friendRequests = [];
          if (!Array.isArray(data.sentRequests)) missing.sentRequests = [];
          if (!Array.isArray(data.likedBy)) missing.likedBy = [];
          if (Object.keys(missing).length > 0) updateDoc(userRef, missing).catch(() => {});
        }
        listenToMyUser();
      } catch (e) {
        console.error('Auth setup error:', e);
        hideLoading();
        showToast('Connection error. Please refresh.', true);
      }
    });

    /* ===== LISTEN TO USER ===== */
    function listenToMyUser() {
      if (userUnsub) userUnsub();
      userUnsub = onSnapshot(
        doc(db, 'users', currentUser.uid),
        (snap) => {
          if (isDeletingTeam) return;
          if (!snap.exists()) {
            myData = { teamId: null }; myTeamId = null; showNoTeamView(); return;
          }
          myData = snap.data();
          if (myData.photoURL) {
            const icon = document.getElementById('navProfileIcon');
            if (icon) icon.innerHTML = '<img src="' + myData.photoURL + '" alt="" style="width:100%;height:100%;object-fit:cover;">';
          }
          const newTeamId = myData.teamId || null;
          if (newTeamId !== myTeamId) {
            myTeamId = newTeamId;
            if (myTeamId) {
              listenToTeam(myTeamId);
            } else {
              if (teamUnsub) { teamUnsub(); teamUnsub = null; }
              if (membersUnsub) { membersUnsub(); membersUnsub = null; }
              currentTeam = null; currentMembers = [];
              showNoTeamView();
            }
          } else if (!myTeamId) {
            showNoTeamView();
          } else {
            hideLoading();
          }
        },
        (error) => {
          console.error('User snapshot error:', error.code);
          hideLoading();
          if (error.code === 'permission-denied') showToast('Permission denied. Check Firebase Rules.', true);
          else showToast('Profile load error.', true);
        }
      );
    }

    /* ===== LISTEN TO TEAM ===== */
    function listenToTeam(teamId) {
      if (teamUnsub) teamUnsub();
      teamUnsub = onSnapshot(
        doc(db, 'teams', teamId),
        (snap) => {
          if (isDeletingTeam) return;
          if (!snap.exists()) {
            myTeamId = null;
            updateDoc(doc(db, 'users', currentUser.uid), { teamId: null }).catch(() => {});
            if (membersUnsub) { membersUnsub(); membersUnsub = null; }
            showNoTeamView(); return;
          }
          currentTeam = { id: snap.id, ...snap.data() };
          isOwner = currentTeam.ownerUid === currentUser.uid;
          listenToMembers(teamId);
        },
        (error) => {
          console.error('Team snapshot error:', error.code);
          if (isDeletingTeam) return;
          hideLoading();
          updateDoc(doc(db, 'users', currentUser.uid), { teamId: null }).catch(() => {});
          showNoTeamView();
        }
      );
    }

    /* ===== LISTEN TO MEMBERS ===== */
    function listenToMembers(teamId) {
      if (membersUnsub) membersUnsub();
      const qy = query(collection(db, 'teamMembers'), where('teamId', '==', teamId));
      membersUnsub = onSnapshot(
        qy,
        (snap) => {
          if (isDeletingTeam) return;
          currentMembers = [];
          snap.forEach(d => currentMembers.push({ id: d.id, ...d.data() }));
          renderTeamView();
        },
        (error) => {
          console.error('Members snapshot error:', error.code);
          if (isDeletingTeam) return;
          hideLoading();
          currentMembers = [];
          renderTeamView();
        }
      );
    }

    /* ===== VIEW FUNCTIONS ===== */
    function showNoTeamView() {
      hideLoading();
      document.getElementById('teamView').classList.add('hidden');
      document.getElementById('noTeamView').classList.remove('hidden');
      document.getElementById('navCreateBtn').classList.remove('hidden');
      document.getElementById('navLeaveBtn').classList.add('hidden');
      document.getElementById('navDeleteBtn').classList.add('hidden');
      const si = document.getElementById('teamSearchInput');
      if (si) si.value = '';
      document.getElementById('teamSearchResults').innerHTML = '';
      loadRandomTeams();
      loadInvites();
    }

    window.toggleProfileDropdown = function() {
      document.getElementById('profileDropdown').classList.remove('show');
    };

    /* ===== RENDER TEAM VIEW ===== */
    async function renderTeamView() {
      hideLoading();
      document.getElementById('noTeamView').classList.add('hidden');
      document.getElementById('teamView').classList.remove('hidden');
      document.getElementById('navCreateBtn').classList.add('hidden');
      document.getElementById('navLeaveBtn').classList.toggle('hidden', isOwner);
      document.getElementById('navDeleteBtn').classList.toggle('hidden', !isOwner);
      document.getElementById('teamNameDisplay').textContent = currentTeam.teamName || 'Team';
      document.getElementById('teamUsernameDisplay').textContent = '@' + (currentTeam.teamUsername || '').replace(/^@/, '');

      if (currentTeam.teamCover) {
        document.getElementById('teamCover').style.backgroundImage = "url('" + currentTeam.teamCover + "')";
      }
      const dp = document.getElementById('teamDp');
      dp.innerHTML = currentTeam.teamLogo
        ? '<img src="' + currentTeam.teamLogo + '" style="width:100%;height:100%;object-fit:cover;">'
        : '👥';

      // add DP edit for owner
      if (isOwner) {
        if (!dp.querySelector('.dp-edit-btn')) {
          const editBtn = document.createElement('div');
          editBtn.className = 'dp-edit-btn';
          editBtn.title = 'Change Logo';
          editBtn.textContent = '✏️';
          editBtn.onclick = () => document.getElementById('logoInput').click();
          dp.appendChild(editBtn);
        }
      } else {
        const existing = dp.querySelector('.dp-edit-btn');
        if (existing) existing.remove();
      }
      // ensure input exists
      if (!document.getElementById('logoInput')) {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.id = 'logoInput';
        inp.accept = 'image/*';
        inp.style.display = 'none';
        inp.onchange = function() { uploadTeamImage(this,'logo'); };
        document.body.appendChild(inp);
      }

      const coverBtn = document.getElementById('coverEditBtn');
      if (isOwner) coverBtn.classList.remove('hidden');
      else coverBtn.classList.add('hidden');

      const members = currentMembers.slice().sort((a,b)=>a.position-b.position);
      document.getElementById('membersTitle').textContent = '👥 TEAM MEMBERS (' + members.length + '/5)';

      // fetch user data
      const userCache = {};
      await Promise.allSettled(
        members.map(async m => {
          try {
            const us = await getDoc(doc(db,'users',m.uid));
            if (us.exists()) userCache[m.uid] = us.data();
          } catch{}
        })
      );

      const list = document.getElementById('membersList');
      list.innerHTML = '';
      const byPos = {};
      members.forEach(m=>byPos[m.position]=m);

      for (let pos=1;pos<=5;pos++) {
        const m = byPos[pos];
        const box = document.createElement('div');
        box.dataset.position = pos;
        if (!m) {
          box.className = 'member-box empty' + (pos===5?' extra-player':'') + (isOwner?' clickable':'');
          box.innerHTML = '<div class="member-position">'+pos+'</div><div class="add-member">'+(isOwner?'+':'')+'</div><div class="member-info"><div class="member-name" style="color:#444">'+(isOwner?(pos===5?'Add Extra':'Add Member'):(pos===5?'Extra Player':'Empty Slot'))+'</div></div>';
          if (isOwner) box.onclick = openSearch;
          list.appendChild(box);
          continue;
        }
        const u = userCache[m.uid]||{};
        const memberIsOwner = m.uid===currentTeam.ownerUid;
        const online = !!u.online;
        const photo = u.photoURL?'<img src="'+u.photoURL+'">':'👤';
        const name = u.name||'Player';

        // Role badge styling for selected
        const role = m.role||'Default';
        const ownerBadge = memberIsOwner?' <span class="member-badge">OWNER</span>':'';

        const canEdit = isOwner||m.uid===currentUser.uid;
        const btnClass = role==='Default'?'default':'';
        const roleBtn = canEdit && !(memberIsOwner && !isOwner)
          ? '<div class="role-select-btn '+btnClass+'" onclick="openRolePopup('+pos+')">'+role+ownerBadge+'</div>'
          : '<div class="role-select-btn disabled">'+role+ownerBadge+'</div>';

        box.className = 'member-box filled'+(pos===5?' extra-player':'');
        box.dataset.uid = m.uid;
        box.innerHTML =
          '<div class="status-text '+(online?'online':'offline')+'">'+(online?'Online':'Offline')+'</div>'+
          '<div class="member-position">'+pos+'</div>'+
          '<div class="member-avatar" onclick="openQuickCard(\''+m.uid+'\')">'+photo+'</div>'+
          '<div class="member-info"><div class="member-name" onclick="openQuickCard(\''+m.uid+'\')">'+name+'</div><div class="role-wrapper">'+roleBtn+'</div></div>'+
          '<div class="menu-dots '+(isOwner&&!memberIsOwner?'show':'')+'" onclick="openOwnerMenu('+pos+')">⋮</div>';
        list.appendChild(box);
      }

      const reqCard = document.getElementById('requestCard');
      if (isOwner) {
        reqCard.classList.remove('hidden');
        renderJoinRequests(currentTeam.joinRequests||[]);
      } else reqCard.classList.add('hidden');
    }

    /* ===== ISSUE 2: Fixed acceptJoinRequest ===== */
    window.acceptJoinRequest = async function(uid) {
      try {
        const teamRef = doc(db,'teams',currentTeam.id);
        const userRef = doc(db,'users',uid);
        const [tSnap,uSnap] = await Promise.all([getDoc(teamRef), getDoc(userRef)]);
        if (!tSnap.exists()) throw new Error('Team not found');
        if (!uSnap.exists()) throw new Error('User not found');
        const team = tSnap.data();
        if ((team.memberCount||0)>=MAX_MEMBERS) throw new Error('Team is full');
        if ((team.memberUids||[]).includes(uid)) throw new Error('Already in team');
        const user = uSnap.data();
        if (user.teamId) throw new Error('Player already in another team');
        const occupied = team.memberPositions||[];
        let pos=1; for(;pos<=MAX_MEMBERS;pos++){ if(!occupied.includes(pos))break; }
        await runTransaction(db,async tx=>{
          tx.set(doc(db,'teamMembers',uid),{uid,teamId:currentTeam.id,role:'Default',position:pos,joinedAt:serverTimestamp()});
          tx.update(userRef,{teamId:currentTeam.id});
          tx.update(teamRef,{
            memberUids:arrayUnion(uid),
            memberCount:(team.memberCount||0)+1,
            memberPositions:arrayUnion(pos),
            joinRequests:arrayRemove(uid)
          });
        });
        showToast('Player added to team!');
      }catch(e){
        console.error('Accept request error:',e);
        showToast(e.message||'Error accepting request',true);
      }
    };

    /* ===== ISSUE 4: Fixed popup role display ===== */
    window.openTeamPopup = async function(teamId) {
      const overlay = document.getElementById('teamPopupOverlay');
      const content = document.getElementById('teamPopupContent');
      overlay.classList.add('show');
      content.innerHTML = '<div style="text-align:center;padding:40px;color:#00d4ff;">Loading...</div>';
      try {
        const teamSnap = await getDoc(doc(db,'teams',teamId));
        if (!teamSnap.exists()) {
          content.innerHTML = '<div style="text-align:center;padding:40px;color:#ff4757;">Team not found</div>';
          return;
        }
        const team = {id:teamSnap.id,...teamSnap.data()};
        const memberSnap = await getDocs(query(collection(db,'teamMembers'),where('teamId','==',teamId)));
        let members=[]; memberSnap.forEach(d=>members.push({id:d.id,...d.data()}));
        members.sort((a,b)=>a.position-b.position);
        const memberCount = members.length;
        const remaining = MAX_MEMBERS - memberCount;
        const isRequested = (team.joinRequests||[]).includes(currentUser.uid);
        const isFull = memberCount>=MAX_MEMBERS;
        const alreadyInTeam = !!myTeamId;
        const uDocs = await Promise.allSettled(members.map(m=>getDoc(doc(db,'users',m.uid))));
        const coverHtml = team.teamCover
          ? '<img src="'+team.teamCover+'" class="team-popup-cover" onerror="this.style.display=\\\'none\\\'">'
          : '<div class="team-popup-cover"></div>';
        const logoHtml = team.teamLogo?'<img src="'+team.teamLogo+'">':'👥';
        let membersHtml = '';
        members.forEach((m,i)=>{
          let u={};
          if (uDocs[i].status==='fulfilled'&&uDocs[i].value.exists()) u=uDocs[i].value.data();
          const photo = u.photoURL?'<img src="'+u.photoURL+'">':'👤';
          const role = m.role||'Default';
          const displayRole = role + (m.uid===team.ownerUid?' 👑':'');
          membersHtml += '<div class="team-popup-member" onclick="openQuickCard(\\''+m.uid+'\\')">'+
            '<div class="team-popup-member-av">'+photo+'</div>'+
            '<div><div class="team-popup-member-name">'+(u.name||'Player')+'</div>'+
            '<div class="team-popup-member-role">'+displayRole+'</div></div></div>';
        });
        let joinBtnClass='team-popup-join-btn',joinBtnText='✅ JOIN TEAM',joinOnclick='sendJoinRequestFromPopup(\\''+teamId+'\\')',joinDisabled='';
        if (alreadyInTeam) { joinBtnClass+=' disabled-state'; joinBtnText='ALREADY IN TEAM'; joinDisabled='disabled'; }
        else if (isRequested) { joinBtnClass+=' disabled-state'; joinBtnText='✓ REQUESTED'; joinDisabled='disabled'; }
        else if (isFull) { joinBtnClass+=' full-state'; joinBtnText='❌ TEAM FULL'; joinDisabled='disabled'; }
        content.innerHTML = 
          coverHtml +
          '<div class="team-popup-dp-wrap"><div class="team-popup-dp">'+logoHtml+'</div></div>'+
          '<div class="team-popup-info"><div class="team-popup-name">'+(team.teamName||'Team')+'</div>'+
          '<div class="team-popup-username">@'+(team.teamUsername||'').replace(/^@/,'')+'</div>'+
          '<div class="team-popup-slots">👥 '+memberCount+'/5 | '+remaining+' slots left</div></div>'+
          '<div class="team-popup-members-title">👥 MEMBERS</div>'+
          '<div class="team-popup-members">'+(membersHtml||'<div style="text-align:center;color:#666;padding:10px;">No members yet</div>')+'</div>'+
          '<div class="team-popup-btns"><button class="'+joinBtnClass+'" onclick="'+joinOnclick+'" '+joinDisabled+'>'+joinBtnText+'</button>'+
          '<button class="team-popup-cancel-btn" onclick="closeTeamPopupDirect()">CANCEL</button></div>';
      } catch (e) {
        console.error('Team popup error:',e);
        content.innerHTML = '<div style="text-align:center;padding:40px;color:#ff4757;">Error loading team</div>';
      }
    };
    window.handlePopupOverlayClick = function(e){ if(e.target===document.getElementById('teamPopupOverlay')) closeTeamPopupDirect(); };
    window.closeTeamPopupDirect = function(){ document.getElementById('teamPopupOverlay').classList.remove('show'); };
    window.sendJoinRequestFromPopup = async function(teamId){
      try {
        await updateDoc(doc(db,'teams',teamId),{joinRequests:arrayUnion(currentUser.uid)});
        showToast('Join request sent!'); openTeamPopup(teamId);
      }catch(e){ console.error(e); showToast('Error sending request',true); }
    };

    /* … the rest of your existing JS remains unchanged … */

  </script>
